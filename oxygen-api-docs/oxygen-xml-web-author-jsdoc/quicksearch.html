n the document, or rejected with an error with message. Type Promise.&lt;Void&gt; &lt;async&gt; commentAdded(comment) Method called right after a comment is added in the document. Parameters: Name Type Description comment ReviewComment The comment to add. Since: 28.1 Returns: A promise. Type Promise.&lt;Void&gt; &lt;async&gt; commentEdited(newComment, oldComment) Method called right after a comment is edited in the document. Parameters: Name Type Description newComment ReviewComment The new comment. oldComment ReviewComment The old comment. Since: 28.1 Returns: A promise. Type Promise.&lt;Void&gt; createSelectionAroundOffsets(startOffset, opt_endOffset, opt_anchorOffset, opt_focusOffset) Parameters: Name Type Description startOffset number The start offset. opt_endOffset number The end offset. Exclusive offset. opt_anchorOffset number The anchor offset. opt_focusOffset number The focus offset. Returns: The selection on text. Type SelectionCore editorChanged() getAuthorName() Get the comment author name. Returns: The author name. Type string getCommentText() Get the comment text. Returns: The comment. Type string getIcon() getMentionedUserNames() Get the mentioned user names within the comment. Returns: The mentioned user names within the comment. Type Array.&lt;string&gt; getTimestamp() Get the raw timestamp value as it can be found in document (see the \"timestamp\" attribute of the \"oxy_comment_start\" PI). This can be use to find the corresponding Java object via ro.sync.ecss.extensions.api.highlights.AuthorPersistentHighlightConstants.MODIFICATION_TIME. Returns: The raw timestamp value. For example: \"20260202T164200+0200\". Type string getTitle() getToolbarActionsMap() getToolbarDescriptor() getUserMentionsProposals() Returns a promise that resolves to an array of user mention proposals groups. For example: [ { categoryName: 'Recent Collaborators', users: [ { username: 'John Doe 1', email: 'john.doe@example.com' }, { username: 'Jane Doe 2' }, ] }, { categoryName: 'Others', users: [ { username: 'John Doe 3', email: 'john.doe3@example.com' }, { username: 'Jane Doe 4' }, ] }, ] OR it can be: [ { username: 'John Doe 1', email: 'john.doe@example.com' }, { username: 'Jane Doe 2' }, { username: 'John Doe 3', email: 'john.doe3@example.com' }, { username: 'Jane Doe 4' }, ] Since: 28.1 Returns: User mention proposals or groups of users. Type Promise.&lt;(Array.&lt;UserMentionProposalsGroup&gt;|Array.&lt;UserMentionProposal&gt;)&gt; install() opened() refreshNodes(href) Refresh all nodes that have the given href. Parameters: Name Type Description href string Href to find the nodes to refresh. If null all nodes will be refreshed. Since: 27.0 registerReviewCommentHook(reviewCommentHook) Registers a hook that is called when a review comment is explicitly added or edited in the document by the user Note that this hook is called when the user explicitly adds a comment in the document using the Add Comment dialog, but there are also other ways to add a comment in the document, for example when the user adds a fragment with copy-paste, from XML Source (text page), etc. Parameters: Name Type Description reviewCommentHook sync.api.author.ReviewCommentHook Hook that intercepts review comments added or edited in the document. Since: 28.1 setUserMentionProposalsProvider(userMentionProposalsProvider) Sets a provider that returns user names that will be presented as proposals when user types \"@\" in the Add Comment dialog. Parameters: Name Type Description userMentionProposalsProvider sync.api.author.UserMentionProposalsProvider Provider that returns user names that can be mentioned in a comment. Since: 28.1 supportsEditor() Type Definitions LoadedDocument Properties: Name Type Argument Description contentType string The MIME type of the document. document string &lt;optional&gt; The content of the document, for documents with a text/* MIME type. UserMentionProposal Type: Object Properties: Name Type Argument Description username String The user name. email String &lt;optional&gt; The user email. UserMentionProposalsGroup Type: Object Properties: Name Type Argument Description users Array.&lt;UserMentionProposal&gt; The users in this category. categoryName String &lt;optional&gt; The category to which this user, proposed to be mentioned, belongs. The categories are displayed visually in the UI in the menu shown when the ‘@’ symbol is pressed. Each category is a group of users. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"classes.list.html":{"id":"classes.list.html","title":"Classes","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformations  new Disposable() Class that provides the basic implementation for disposable objects. If your class holds one or more references to COM objects, DOM nodes, or other disposable objects, it should extend this class or implement the disposable interface (defined in goog.disposable.IDisposable). Methods addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. dispose() Disposes of the object. If the object hasn't already been disposed of, calls #disposeInternal. Classes that extend `goog.Disposable` should override #disposeInternal in order to delete references to COM objects, DOM nodes, and other disposable objects. Reentrant. Returns: Nothing. Type void &lt;protected&gt; disposeInternal() Deletes or nulls out any references to COM objects, DOM nodes, or other disposable objects. Classes that extend `goog.Disposable` should override this method. Not reentrant. To avoid calling it twice, it must only be called from the subclass' `disposeInternal` method. Everywhere else the public `dispose` method must be used. For example: mypackage.MyClass = function() { mypackage.MyClass.base(this, 'constructor'); // Constructor logic specific to MyClass. ... }; goog.inherits(mypackage.MyClass, goog.Disposable); mypackage.MyClass.prototype.disposeInternal = function() { // Dispose logic specific to MyClass. ... // Call superclass's disposeInternal at the end of the subclass's, like // in C++, to avoid hard-to-catch issues. mypackage.MyClass.base(this, 'disposeInternal'); }; isDisposed() Returns: Whether the object has been disposed of. Type boolean registerDisposable(disposable) Associates a disposable object with this object so that the ur class into a Listenable. Unless propagation is stopped, an event dispatched by an EventTarget will bubble to the parent returned by `getParentEventTarget`. To set the parent, call `setParentEventTarget`. Subclasses that don't support changing the parent can override the setter to throw an error. Example usage: var source = new goog.events.EventTarget(); function handleEvent(e) { alert('Type: ' + e.type + '; Target: ' + e.target); } source.listen('foo', handleEvent); ... source.dispatchEvent('foo'); // will call handleEvent ... source.unlisten('foo', handleEvent); Extends goog.Disposable Methods addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. Inherited From: goog.Disposable#addOnDisposeCallback dispatchEvent(e) Dispatches an event (or event like object) and calls all listeners listening for events of this type. The type of the event is decided by the type property on the event object. If any of the listeners returns false OR calls preventDefault then this function will return false. If one of the capture listeners calls stopPropagation, then the bubble listeners won't fire. Parameters: Name Type Description e Object | goog.events.Event Event object. Returns: If anyone called preventDefault on the event object (or if any of the listeners returns false) this will also return false. Type boolean dispose() Disposes of the object. If the object hasn't already been disposed of, calls #disposeInternal. Classes that extend `goog.Disposable` should override #disposeInternal in order to delete references to COM objects, DOM nodes, and other disposable objects. Reentrant. Inherited From: goog.Disposable#dispose Returns: Nothing. Type void &lt;protected&gt; disposeInternal() Removes listeners from this object. Classes that extend EventTarget may need to override this method in order to remove references to DOM Elements and additional listeners. Inherited From: goog.events.EventTarget#disposeInternal Overrides: goog.Disposable#disposeInternal getParentEventTarget() Returns the parent of this event target to use for bubbling. Returns: The parent EventTarget or null if there is no parent. Type goog.events.EventTarget isDisposed() Inherited From: goog.Disposable#isDisposed Returns: Whether the object has been disposed of. Type boolean listen(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener. A listener can only be added once to an object and if it is added again the key for the listener is returned. Note that if the existing listener is a one-off listener (registered via listenOnce), it will no longer be a one-off listener after a call to listen(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. listenOnce(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener that is removed automatically after the listener fired once. If an existing listener already exists, listenOnce will do nothing. In particular, if the listener was previously registered via listen(), listenOnce() will not turn the listener into a one-off listener. Similarly, if there is already an existing one-off listener, listenOnce does not modify the listeners (it is still a once listener). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. registerDisposable(disposable) Associates a disposable object with this object so that they will be disposed together. Parameters: Name Type Description disposable goog.disposable.IDisposable that will be disposed when this object is disposed. Inherited From: goog.Disposable#registerDisposable removeAllListeners( [opt_type]) Removes all listeners from this listenable. If type is specified, it will only remove listeners of the particular type. otherwise all registered listeners will be removed. Parameters: Name Type Argument Description opt_type string &lt;optional&gt; Type of event to remove, default is to remove all types. Returns: Number of listeners removed. Type number unlisten(type, listener [, opt_useCapture] [, opt_listenerScope]) Removes an event listener which was added with listen() or listenOnce(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Returns: Whether any listener was removed. Type boolean × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"HighlightsManager.html":{"id":"HighlightsManager.html","title":"Class: HighlightsManager","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.A  2 TEXT - 3 ENTITY_REFERENCE - 5 PROCESSING_INSTRUCTION - 7 COMMENT - 8 DOCUMENT - 9 parentNode Node The parent of the current node, null for the #document node and for attributes. childNodes NodeList A NodeList that contains all children of this node. If there are no children, this is a NodeList containing no nodes firstChild Node The first child of this node. If there is no such node, this returns null. lastChild Node The last child of this node. If there is no such node, this returns null. previousSibling Node The node immediately preceding this node. If there is no such node, this returns null. nextSibling Node The node immediately following this node. If there is no such node, this returns null. attributes NamedNodeMap A NamedNodeMap containing the attributes of this node (if it is an Element) or null otherwise ownerDocument Document The Document object associated with this node. namespaceURI string The namespace URI of this node - null if there is no namespace or if the node is not Element or Attribute. prefix string The prefix of this node - null if there is no namespace or if the node is not Element or Attribute. localName string The local name of this node, null if not attribute or element. baseURI string The base URI for this node - it takes content references and xi:includes into account, but not the xml:base attribute. textContent string The text content of the node - it ignores descendant comments and processing instructions. For attributes it returns the its value. Methods compareDocumentPosition(other) Compares the reference node, i.e. the node on which this method is being called, with a node, i.e. the one passed as a parameter, with regard to their position in the document and according to the document order. Parameters: Name Type Description other Node The node to compare to. Returns: A bitmask with the following values from the Node class: DOCUMENT_POSITION_CONTAINED_BY - The node is contained by the reference node. A node which is contained is always following, too. DOCUMENT_POSITION_CONTAINS - The node contains the reference node. A node which contains is always preceding, too. DOCUMENT_POSITION_DISCONNECTED - The two nodes are disconnected. Order between disconnected nodes is always implementation-specific. DOCUMENT_POSITION_FOLLOWING - The node follows the reference node. DOCUMENT_POSITION_IMPLEMENTATION_SPECIFIC - The determination of preceding versus following is implementation-specific. DOCUMENT_POSITION_PRECEDING - The second node precedes the reference node. Type number hasAttributes() Returns true if the node has attributes. Returns: if the node has attributes. Type true hasChildNodes() Returns whether this node has any children. Returns: true if the node has child nodes. Type boolean hasChildNodes() Returns whether this node has any children. Returns: true if the node has child nodes. Type boolean isEqualNode(other) Test if two nodes have the same structure. Parameters: Name Type Description other Node The node to compare to. Returns: true if the two nodes have the same structure. Type boolean isSameNode(other) The API may return different JS DOM objects for the same XML node - to detect this case, use this method. Parameters: Name Type Description other Node The node to compare to. Returns: true if the two objects represent the same XML node. Type boolean lookupNamespaceURI(prefix) Look up the namespace URI associated to the given prefix, starting from this node. Parameters: Name Type Description prefix string The URI of the namespace. Returns: the mapped namespace URI. Type string lookupPrefix(namespaceURI) Look up the prefix associated to the given namespace URI, starting from this node. The default namespace declarations are ignored by this method. Parameters: Name Type Description namespaceURI string The URI of the namespace. Returns: the associated prefix, or null if there is no associated prefix. If there are multiple mappings, return the closest one to this node. Type string × Search resul ON_FOLLOWING - The node follows the reference node. DOCUMENT_POSITION_IMPLEMENTATION_SPECIFIC - The determination of preceding versus following is implementation-specific. DOCUMENT_POSITION_PRECEDING - The second node precedes the reference node. Type number hasAttributes() Returns true if the node has attributes. Inherited From: Node#hasAttributes Returns: if the node has attributes. Type true hasChildNodes() Returns whether this node has any children. Inherited From: Node#hasChildNodes Overrides: Node#hasChildNodes Returns: true if the node has child nodes. Type boolean isEqualNode(other) Test if two nodes have the same structure. Parameters: Name Type Description other Node The node to compare to. Inherited From: Node#isEqualNode Returns: true if the two nodes have the same structure. Type boolean isSameNode(other) The API may return different JS DOM objects for the same XML node - to detect this case, use this method. Parameters: Name Type Description other Node The node to compare to. Inherited From: Node#isSameNode Returns: true if the two objects represent the same XML node. Type boolean lookupNamespaceURI(prefix) Look up the namespace URI associated to the given prefix, starting from this node. Parameters: Name Type Description prefix string The URI of the namespace. Inherited From: Node#lookupNamespaceURI Returns: the mapped namespace URI. Type string lookupPrefix(namespaceURI) Look up the prefix associated to the given namespace URI, starting from this node. The default namespace declarations are ignored by this method. Parameters: Name Type Description namespaceURI string The URI of the namespace. Inherited From: Node#lookupPrefix Returns: the associated prefix, or null if there is no associated prefix. If there are multiple mappings, return the closest one to this node. Type string × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.html":{"id":"sync.html","title":"Namespace: sync","body":" Oxygen XML Web or the editor actions. Besides the action behavior, this class also specifies how the buttons that trigger the action should be rendered. This rendering is represented by an action display name, a description (usually presented on a tooltip), and some icons to be rendered depending on the button size. Parameters: Name Type Argument Description keystrokeStr string &lt;optional&gt; the string representation of the shortcut of the action. Methods actionPerformed(callback) Abstract method that executes the action. Parameters: Name Type Description callback function A function to call after the action was performed to notify the editor that the action was finished. It must be called even when the action finished with an error. dispose() Should dispose all the resources required by the action. getDescription() Returns the description for the action - usually displayed on a tooltip. Returns: The description. Type string getDisplayName() Returns the display name for the action. Returns: The display name. Type string &lt;protected&gt; getLargeIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's large icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The large icon should have a minimum size of 24 by 24 px for non-hidpi displays and can vary depending on the device pixel ration, the icon being used as the background of a 24 by 24 px DIV. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Returns: The icon URL. Type string getShortcut() Returns the shortcut, represented as a string. E.g. - \"Ctrl B\" - \"Alt Shift T\" - \"Ctrl Alt equals\" - \"Ctrl period\" - \"Ctrl comma\" - \"Ctrl back_quote\" - \"Ctrl open_bracket\" - \"Ctrl back_slash\" - \"Ctrl num_lock\" - \"Ctrl divide\" The shortcut may use platform-independent modifiers M1 to M4. Returns: the string representation of the shortcut. If there is no shortcut, returns an empty string. Type string &lt;protected&gt; getSmallIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's small icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The small icon should have a minimum size of 16 by 16 px for non-hidpi displays and can vary depending on the device pixel ration, the small icon being used as the background of a 16px by 16px div. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Returns: The icon URL. Type string isEnabled() Tells whether the action is enabled. Note: The action is not permanently polled for its \"enabled-ness\". If you want the GUI to reflect the current status you will have to call sync.api.ActionsManager#refreshActionsStatus. In the implementation you can use sync.api.SelectionManager to determine the selection. Returns: Whether the action is enabled. Type boolean renderLargeIcon() This method renders the large icon of the action in a 24px by 24px div with the action's large icon as its background. This allows the getLargeIcon() method to return different sized icons depending on the device pixel ration, the size constraints being imposed by the enclosing DIV. It should be overridden only for custom rendering strategies, otherwise consider using the getLargeIcon method. Returns: the rendering of the large icon image. Type Element renderSmallIcon() This method renders the small icon of the action in a 16px by 16px DIV with the action's small icon as its background. This allows the getSmallIcon() method to return different sized icons depending on the device pixel ration, the size constraints being imposed by the enclosing DIV. It should be overridden only for custom rendering strategies, otherwise consider using the getSmallIcon method. Returns: the rendering of the small icon image. Type HTMLElement × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.actions.AttributeEditingAction.html":{"id":"sync.actions.AttributeEditingAction.html","title":"Class: AttributeEditingAction","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescript uteEditingAction new AttributeEditingAction(opt_handler, opt_buttonClass, opt_tooltip) Base class for attribute editing actions. Parameters: Name Type Description opt_handler function A handler function, see the \"actionPerformed\" prototype documentation for more details. opt_buttonClass String An optional class fragment for the button. opt_tooltip String An optional tooltip for the button. Methods actionPerformed(currentValue, done) This method is called when the user invoked attribute editing action. It is intended to show a more specific editing interface for a given URL: e.g. a color picker, an image chooser, etc. Parameters: Name Type Description currentValue string The current value of the attribute. done function The function to be invoked with the edited value. The first parameter is the new value of the attribute. The behaviour of the \"done\" callback is the following: If the argument is the same as the current value, nothing happens. If the argument is null, the attribute will be deleted. If the argument is a string, different than the current value, the value will be updated. The second parameter is a flag that, when set to true, will try to consider the value of the first parameter as an URL and try to make it relative to the XML base url before updating the document. getButtonClass() Renders a small icon for the action. Returns: The URL of the small icon HTML element that corresponds to the small icon. Type string getTooltip() Returns the tooltip on the button Returns: The optional tooltip for the button. Type string × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.actions.AttributeEditingActionsProvider.html":{"id":"sync.actions.AttributeEditingActionsProvider.html","title":"Class: AttributeEditingActionsProvider","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.op dersupportsEditorworkspace Class: OpenAction sync.actions. OpenAction new OpenAction(urlChooser) Open action. Parameters: Name Type Description urlChooser sync.api.UrlChooser the urlChooser the open action will use. Deprecated: since version 20.1.1. Use sync.api.FileServersManager#registerFileServerConnector to register a file server for which inline browsing and create files features are provided. Extends sync.actions.AbstractAction Methods actionPerformed() The actual action execution. Overrides: sync.actions.AbstractAction#actionPerformed dispose() Should dispose all the resources required by the action. Inherited From: sync.actions.AbstractAction#dispose getActionId() Get the action id. Returns: the action id or null if none was provided. Type string getDescription() Returns the description for the action - usually displayed on a tooltip. Inherited From: sync.actions.OpenAction#getDescription Overrides: sync.actions.AbstractAction#getDescription Returns: The description. Type string getDisplayName() Returns the display name for the action. Inherited From: sync.actions.OpenAction#getDisplayName Overrides: sync.actions.AbstractAction#getDisplayName Returns: The display name. Type string &lt;protected&gt; getLargeIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's large icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The large icon should have a minimum size of 24 by 24 px for non-hidpi displays and can vary depending on the device pixel ration, the icon being used as the background of a 24 by 24 px DIV. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Inherited From: sync.actions.OpenAction#getLargeIcon Overrides: sync.actions.AbstractAction#getLargeIcon Returns: The icon URL. Type string getShortcut() Returns the shortcut, represented as a string. E.g. - \"Ctrl B\" - \"Alt Shift T\" - \"Ctrl Alt equals\" - \"Ctrl period\" - \"Ctrl comma\" - \"Ctrl back_quote\" - \"Ctrl open_bracket\" - \"Ctrl back_slash\" - \"Ctrl num_lock\" - \"Ctrl divide\" The shortcut may use platform-independent modifiers M1 to M4. Inherited From: sync.actions.AbstractAction#getShortcut Returns: the string representation of the shortcut. If there is no shortcut, returns an empty string. Type string &lt;protected&gt; getSmallIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's small icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The small icon should have a minimum size of 16 by 16 px for non-hidpi displays and can vary depending on the device pixel ration, the small icon being used as the background of a 16px by 16px div. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Inherited From: sync.actions.OpenAction#getSmallIcon Overrides: sync.actions.AbstractAction#getSmallIcon Returns: The icon URL. Type string isEnabled() Tells whether the action is enabled. Note: The action is not permanently polled for its \"enabled-ness\". If you want the GUI to reflect the current status you will have to call sync.api.ActionsManager#refreshActionsStatus. In the implementation you can use sync.api.SelectionManager to determine the selection. Inherited From: sync.actions.OpenAction#isEnabled Overrides: sync.actions.AbstractAction#isEnabled Returns: Whether the action is enabled. Type boolean openFile(fileUrl) Opens a new file. (Replaces the old url param if there is one) Parameters: Name Type Description fileUrl the file url to open. renderLargeIcon() Handles the rendering of the action's large icon. Overrides: sync.actions.AbstractAction#renderLargeIcon Returns: the rendered large icon. Type HTMLElement renderSmallIcon() This method renders the small icon of the action in a 16px by 16px DIV with the action's small icon as its background. This allows the getSmallIcon() method to return different sized icons depending on the device pixel ration, the size constraints being imposed by the enclosing DIV. It should be overridden only for custom rendering strategies, otherwise consider using the getSmallIcon method. Inherited From: sync.actions.AbstractAction#renderSmallIcon Returns: the rendering of the small icon image. Type HTMLElement setActionId(newActionId) Set the action id. Parameters: Name Type Description newActionId the new action id. setActionName(newName) Sets the action name. The action name is displayed under the action large icon. Parameters: Name Type Description newName the new name. setDescription(newDescription) Sets the action's description. Parameters: Name Type Description newDescription the new action description. setLargeIcon(newLargeIcon) Setter for the action's large icon. Parameters: Name Type Description newLargeIcon the new icon source. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.html":{"id":"sync.api.html","title":"Namespace: api","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.even tion of AuthorOperation or AuthorOperationWithResult. AuthorOperation has a couple of useful implementation for modifying the document structure (see subclasses of https://www.oxygenxml.com/InstData/Editor/SDK/javadoc/ro/sync/ecss/extensions/api/AuthorOperation.html). AuthorOperationWithResult can be used to pass a result back to the JS code after executing the operation on the server. If the operation is a custom one, it should annotate it with ro.sync.ecss.extensions.api.webapp.WebappRestSafe in order for Web Author to allow invoking it from client-side code. params Object An object mapping param names to parameter values. Here you can find details about the arguments of default operations for the Author mode: https://www.oxygenxml.com/doc/help.php?product=editor&amp;platform=standalone&amp;pageId=dg-default-author-operations callback function &lt;optional&gt; The Node-style callback to call when the operation finished executing. The callback's first argument is the error object or null; the second one is the actual result. In order to return a result from an operation one has to implement ro.sync.ecss.extensions.api.webapp.AuthorOperationWithResult . The callback receives an error if there is a problem communicating with the server. If the AuthorOperation throws an AuthorOperationException exception with the isOperationRejectedOnPurpose flag set to true, on the server an error dialog will be shown to the user but the error parameter of the callback will be null. opt_selection Selection &lt;optional&gt; The selection in whose context to execute the operation, if not passed the current selection is used. opt_background boolean &lt;optional&gt; flag indicating whether the operation is executed in the background. If true, after the action is executed, the following happens: the current user selection is not changed, even if the action explicitly moves the caret the focus is not sent to the editor Defaults to false. × Search results Close Documentation generated by JS  the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: CreateDocumentAction sync.api. CreateDocumentAction new CreateDocumentAction(urlChooser) Create action. Parameters: Name Type Description urlChooser sync.api.UrlChooser the urlChooser the create action will use. Deprecated: since version 20.1.1. Use sync.api.FileServersManager#registerFileServerConnector to register a file server for which inline browsing and create files features are provided. Extends sync.actions.AbstractAction Members selectedTemplate_ :sync.model.FrameworkTemplate Type: sync.model.FrameworkTemplate Methods dispose() Should dispose all the resources required by the action. Inherited From: sync.api.CreateDocumentAction#dispose Overrides: sync.actions.AbstractAction#dispose getActionId() Get the action id. Returns: the action id or null if none was provided. Type string getDescription() Returns the description for the action - usually displayed on a tooltip. Inherited From: sync.api.CreateDocumentAction#getDescription Overrides: sync.actions.AbstractAction#getDescription Returns: The description. Type string getDisplayName() Returns the display name for the action. Inherited From: sync.api.CreateDocumentAction#getDisplayName Overrides: sync.actions.AbstractAction#getDisplayName Returns: The display name. Type string &lt;protected&gt; getLargeIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's large icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The large icon should have a minimum size of 24 by 24 px for non-hidpi displays and can vary depending on the device pixel ration, the icon being used as the background of a 24 by 24 px DIV. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Inherited From: sync.api.CreateDocumentAction#getLargeIcon Overrides: sync.actions.AbstractAction#getLargeIcon Returns: The icon URL. Type string getShortcut() Returns the shortcut, represented as a string. E.g. - \"Ctrl B\" - \"Alt Shift T\" - \"Ctrl Alt equals\" - \"Ctrl period\" - \"Ctrl comma\" - \"Ctrl back_quote\" - \"Ctrl open_bracket\" - \"Ctrl back_slash\" - \"Ctrl num_lock\" - \"Ctrl divide\" The shortcut may use platform-independent modifiers M1 to M4. Inherited From: sync.actions.AbstractAction#getShortcut Returns: the string representation of the shortcut. If there is no shortcut, returns an empty string. Type string &lt;protected&gt; getSmallIcon( [devicePixelRation]) One should override this method to provide the absolute URL of the action's small icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The small icon should have a minimum size of 16 by 16 px for non-hidpi displays and can vary depending on the device pixel ration, the small icon being used as the background of a 16px by 16px div. Parameters: Name Type Argument Description devicePixelRation number &lt;optional&gt; the device pixel ratio. Inherited From: sync.api.CreateDocumentAction#getSmallIcon Overrides: sync.actions.AbstractAction#getSmallIcon Returns: The icon URL. Type string isEnabled() Tells whether the action is enabled. Note: The action is not permanently polled for its \"enabled-ness\". If you want the GUI to reflect the current status you will have to call sync.api.ActionsManager#refreshActionsStatus. In the implementation you can use sync.api.SelectionManager to determine the selection. Inherited From: sync.api.CreateDocumentAction#isEnabled Overrides: sync.actions.AbstractAction#isEnabled Returns: Whether the action is enabled. Type boolean renderLargeIcon() Handles the rendering of the action's large icon. Overrides: sync.actions.AbstractAction#renderLargeIcon Returns: the rendered large icon. Type HTMLElement renderSmallIcon() This method renders the small icon of the action in a 16px by 16px DIV with the action's small icon as its background. This allows the getSmallIcon() method to return different sized icons depending on the device pixel ration, the size constraints being imposed by the enclosing DIV. It should be overridden only for custom rendering strategies, otherwise consider using the getSmallIcon method. Inherited From: sync.actions.AbstractAction#renderSmallIcon Returns: the rendering of the small icon image. Type HTMLElement setActionId(newActionId) Set the action id. Parameters: Name Type Description newActionId the new action id. setActionName(newName) Sets the action name. The action name is displayed under the action large icon. Parameters: Name Type Description newName the new name. setDescription(newDescription) Sets the action's description. Parameters: Name Type Description newDescription the new action ies: Name Type Default Description SIZE_CHANGED string size_changed Generated when the dialog size changed. See sync.api.Dialog.SizeChangedEvent for more details. Methods dispose() Disposes all the resources associated with the dialog, un-registers all the listeners and removes it from the DOM. focus() Focuses the dialog window. getElement() Returns the HTML element that represents the content of the dialog window, So that custom content can be added to it. Returns: The element of the dialog. Type HTMLElement getEventTarget() Getter for the dialog event target. Returns: Type goog.events.EventTarget hide() Hides the dialog window. isVisible() Returns true if the dialog is visible. onSelect(callback) Sets the callback to be called when a button is pressed. It is called only once - the next time the dialog is shown, you will need to register an onSelect callback again. Parameters: Name Type Description callback sync.api.Dialog~onSelectCallback the callback used when the user chooses an option on the dialog. setBackgroundElementOpacity(opacity) Sets the opacity of the background mask. Parameters: Name Type Description opacity number Background mask opacity. The default value is 0.5 (50% opacity). Since: 21.1 setButtonConfiguration(config) Sets the button configuration of the dialog. Parameters: Name Type Description config sync.api.Dialog.ButtonConfiguration The button configuration setContentPreferredSize(width, height) Sets the preferred size for this dialog content. Parameters: Name Type Description width number The preferred width. height number The preferred height. setHasTitleCloseButton(hasTitleCloseButton) Sets whether the dialog should have a close button in the title bar. This works only for non-modal dialogs, see sync.api.Dialog.setModal(). Parameters: Name Type Description hasTitleCloseButton boolean Whether this dialog should have a title close button. Since: 21.1 setModal(modal) Makes the dialog modal/non-modal. The dialog is modal by default. Parameters: ying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: EditingSupport sync.api. EditingSupport new EditingSupport(options) Support for rendering the content of the current editor and for setting the actions, toolbars and views associated with it. Can be obtained by using sync.api.Editor#getEditingSupport. Parameters: Name Type Description options sync.api.Workspace.LoadingOptions The options to be used by the editing support. Classes DirtyStatusChangedEvent Members &lt;static&gt; EventType :String Event types. Type: String Properties: Name Type Default Description DIRTY_STATUS_CHANGED String AES_dirty_status_changed MODEL_CHANGED String AES_model_changed options :sync.api.Workspace.LoadingOptions The options used to load the editing support. Type: sync.api.Workspace.LoadingOptions Methods disposeInternal() Method that disposes the editing support. Sub-classes must call the super implementation of this method. Use it to do things like: - dispose dialogs - stop timers - unregister listeners on global objects, etc. focus() Focus the editing support. getActionsManager() Returns the actions manager for the current document. Returns: The actions manager. Type sync.api.ActionsManagerCore getApplicationToolbar() Get the configuration of the application toolbar. By default the application toolbar is displayed on the left side of the file name, next to the application icon (on small screns it is the first toolbar from the toolbars bar). Returns: The toolbars actions list descriptor. Type Array.&lt;sync.api.Editor.ActionsLoadedEvent.ActionsListDescriptor&gt; getConcurrentEditingManager() Returns: The concurrent editing manager for the current document, or null if concurrent editing is not supported for the current type of document. Type sync.api.ConcurrentEditingManager | null getContent(callback) Retrieves the content of the document asynchronously. Parameters: Name Type Description callback sync.api.EditingSupport~onContentReceived The callback that will be called once the XML content is retrieved. getContentType() Get the content type of the document as detected by the server. See also: - editor, options) - sync.api.EditingSupport.getType - sync.api.Editor.getEditorType Since: 28.1. Returns: The document content type (for example, \"text/xml\", \"text/plain\", \"text/markdown\", etc.). Type string getFirstToolbar() Get the configuration of the first toolbar. Returns: The toolbars actions list descriptor. Type Array.&lt;sync.api.Editor.ActionsLoadedEvent.ActionsListDescriptor&gt; getHighlightsManager() Returns the handler for non persistent highlights. Returns: The highlights manager. Type sync.api.HighlightsManager | null getOtherToolbars(done) Get the configuration of other toolbars. Parameters: Name Type Description done function Callback when the toolbars actions list descriptor is ready to be used. getResourceDragHandler() Get the handler for dragging resources inside the editor area. Returns: Resource drag handler. Type sync.view.ResourceDragHandler getSelectionManager() Returns the selection manager of the document. Returns: The selection manager. Type sync.api.SelectionManagerCore getSpellChecker() Get the editor spellchecker. Returns: The spellchecker. Type sync.api.SpellChecker getType() Get the type of the editor. Returns: the type of the editor. Type sync.api.Editor.EditorTypes getUrl() Get the URL of the document. Returns: The URL. Type string load(newDoc, docContainer, problemReporter) Initializes the editing support. Parameters: Name Type Description newDoc LoadedDocument The document created by the server. docContainer HTMLElement The element in which we add our editor. problemReporter NotificationsManager The problem reporter. Returns: An object with a 'then' method that fulfills when the editing support is loaded. Type Thenable &lt;abstract&gt; performFind(termToFind) Performs a find query with the specified term. Parameters: Name Type Argument Description termToFind String &lt;nullable&gt; scheduleDocumentTransaction(transaction) Schedules a transaction to modify the document. The transaction can read information from the document DOM, manipulate the selection and invoke AuthorOperations. Other concurrent user actions or synchronizations from peers do not affect the execution of this transaction. The transaction may not run if an action with Scheduler.ActionType.HANDLES_BLOCKING type is in progress. Parameters: Name Type Description transaction function The transaction to schedule. scrollToAnchor(url) Scrolls the document to the anchor of the url, if any. Parameters: Name Type Description url string The url. Returns: True if the scroll is possible. Type boolean Type Definitions onContentReceived(error, content) A callback invoked when the asynchronous request for the content finishes. If the operation is successful, the first parameter is null and the second one is a string that represents the content. In case of an error, the first parameter is an object describing the error. Parameters: Name Type Description error object The error object, or null if the request was successful. content string The serialized XML content. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.EditingSupport.DirtyStatusChangedEvent.html":{"id":"sync.api.EditingSupport.DirtyStatusChangedEvent.html","title":"Class: DirtyStatusChangedEvent","body":" Oxygen XML Web Author Namespaces syncsync.act onImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: Editor sync.api. Editor new Editor() A visual editor for an XML document. Extends goog.events.EventTarget Classes ActionsLoadedEvent DirtyStatusChangedEvent LinkOpenedEvent WebappMessageReceived Members &lt;static&gt; EditorTypes :string sync.api.Editor types Type: string Properties: Name Type Default Description AUTHOR string author The editor is of type author. XML string xml The editor is of type XML. MARKDOWN string markdown The editor is of type markdown. TEXT string text The editor is of type text. IMAGE string image The editor is of type text. DIFF string diff An editor that presents the differences between two documents. TREE string dita-map-tree An editor that presents the DITA Map Tree Structure &lt;static&gt; EventTypes :string Event types generated by this editor. These events will also trigger on the `workspace` object which is the parent event target of the editor. Type: string Properties: Name Type Default Description LINK_OPENED string link_openend Generated when a link is about to be opened. See sync.api.Editor.LinkOpenedEvent for more details. CUSTOM_MESSAGE_RECEIVED string custom_message Generated when an sync.api.WebappMessage whose type is not handled by the webapp itself was reported on the server-side. See sync.api.Editor.WebappMessageReceived for more details. ACTIONS_LOADED string actions_loaded Generated when some editor-related actions were loaded. See sync.api.Editor.ActionsLoadedEvent for more details. DIRTY_STATUS_CHANGED string dirty_status_changed Generated when the editor changes its dirty status. See sync.api.Editor.DirtyStatusChangedEvent for more details. DISPOSE string dispose Generated before the editor is disposed. This event cannot be cancelled. Methods addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. Inherited From: goog.Disposable#addOnDisposeCallback createBasicEditingSupport() Create a basic editing support for this editor. It provides support for rendering the content of the current editor and access to basic action (Cut/Copy/Paste). It does not include the toolbars, context menus and views support. It can be used to impose the editing support for a specific document. See sync.api.EditingSupportManager.registerEditingSupportProvider. Returns: The basic editing support. Type sync.api.AuthorEditingSupport dispatchEvent(e) Dispatches an event (or event like object) and calls all listeners listening for events of this type. The type of the event is decided by the type property on the event object. If any of the listeners returns false OR calls preventDefault then this function will return false. If one of the capture listeners calls stopPropagation, then the bubble listeners won't fire. Parameters: Name Type Description e Object | goog.events.Event Event object. Inherited From: goog.events.EventTarget#dispatchEvent Returns: If anyone called preventDefault on the event object (or if any of the listeners returns false) this will also return false. Type boolean dispose() Dispose the editor. Since: 28.0 Overrides: goog.events.EventTarget#dispose Returns: A promise that resolves when dispose completes. In case of author documents, the promise resolves after the server-side AuthorDocumentModel is disposed (after ro.sync.ecss.extensions.api.webapp.access.WebappEditingSessionLifecycleListener.editingSessionClosed()). Type Promise.&lt;void&gt; getActionsManager() Returns the actions manager for the current editor. Returns: the actions manager of this editor. Type sync.api.ActionsManager getChangeTrackingManager() Returns the change tracking manager for the current editor. Returns: the change tracking manager, or null for non-author editors. Type sync.api.ChangeTrackingManager getContent(callback) Retrieves the content of the document asynchronously. Parameters: Name Type Description callback sync.api.Editor~onContentReceived The callback that will be called once the XML content is retrieved. getEditingSupport() Get the editing support. Note that the base class for EditingSupport is sync.api.EditingSupport but this class has multiple subclasses, for example: sync.api.AuthorEditingSupport sync.api.TextEditingSupport To check the subclass type see the sync.api.EditingSupport#getType method, for example: let isAuthorEditingSupport = editingSupport.getType() === sync.api.Editor.EditorTypes.AUTHOR; Returns: The editing support. Type sync.api.EditingSupport | null getEditorType() Returns: the type of the current editor if it was determined, null otherwise. Type sync.api.Editor.EditorTypes getFileServer() Get the descriptor of the file server where the file opened in editor is stored. The connector for this file server was registered by using the sync.api.FileServersManager#registerFileServerConnector method. Since: 20.1.1 Returns: The descriptor of the file server that contains the file opened in editor. Type sync.api.FileServerDescriptor getHighlightsManager() Returns the handler for non persistent highlights. Deprecated: Use sync.api.AuthorWidgetsFactory#getHighlightsManager instead. Returns: The highlights manager. Type sync.api.HighlightsManager | null getParentEventTarget() Returns the parent of this event target to use for bubbling. Inherited From: goog.events.EventTarget#getParentEventTarget Returns: The parent EventTarget or null if there is no parent. Type goog.events.EventTarget getReadOnlyState() Returns: the read-only state of the editor. Type sync.api.ReadOnlyState getResourceDragHandler() Get the resource drag handler. Returns: Type ResourceDragHandler getSelectionManager() Returns the selection method of the editor. Returns: The selection manager. Type sync.api.SelectionManager getSpellChecker() Return the spellchecker of the editor, if available. Returns: The spellchecker. Type sync.api.SpellChecker | null getUrl() Returns: The URL of the file opened in the editor. Type string getXmlContent(callback) Retrieves the content of the XML document asynchronously. Parameters: Name Type Description callback sync.api.Editor~onXmlContentReceived The callback that will be called once the XML content is retrieved. Deprecated: Yes isDirty() Returns: true if the editor is marked as dirty. Type boolean isDisposed() Inherited From: goog.Disposable#isDisposed Returns: Whether the object has been disposed of. Type boolean listen(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener. A listener can only be added once to an object and if it is added again the key for the listener is returned. Note that if the existing listener is a one-off listener (registered via listenOnce), it will no longer be a one-off listener after a call to listen(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listen listenOnce(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener that is removed automatically after the listener fired once. If an existing listener already exists, listenOnce will do nothing. In particular, if the listener was previously registered via listen(), listenOnce() will not turn the listener into a one-off listener. Similarly, if there is already an existing one-off listener, listenOnce does not modify the listeners (it is still a once listener). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listenOnce load(options) Loads an editor with the given options. Should not be called if the editor was not already loaded Parameters: Name Type Description options sync.api.Workspace.LoadingOptions The options used to open the editor. loadPreview(container, options) Load the (read-only) preview of a document inside a specified element. Parameters: Name Type Description container HTMLElement The element in which we add our editor. options sync.api.Workspace.LoadingOptions The options to be used to load the document preview. The following options are used to create the preview: sync.api.Workspace.LoadingOptions#url sync.api.Workspace.LoadingOptions#elementNameEnhancer sync.api.Workspace.LoadingOptions#expandTopicRefs sync.api.Workspace.LoadingOptions#KeyscopeStack Returns: A thenable that fulfills when the document preview is loaded. Type Thenable.&lt;(sync.api.EditingSupport|sync.api.AuthorEditingSupport)&gt; registerAttributeActionsProvider(attributeActionsProvider) Register a provider that is used to determine a custom interface used to edit an attribute. This method should be called after the editor is loaded. Parameters: Name Type Description attributeActionsProvider sync.actions.AttributeEditingActionsProvider The actions provider. registerDisposable(disposable) Associates a disposable object with this object so that they will be disposed together. Parameters: Name Type Description disposable goog.disposable.IDisposable that will be disposed when this object is disposed. Inherited From: goog.Disposable#registerDisposable registerEnhancer(name, enhancer) Registers an enhancer for a type of form controls. This registration should be performed before the editor is loaded, so that the enhancer can be used for the initial rendering of the document. Parameters: Name Type Description name string The type of the form-control, which is the fully qualified name of the Java WebappFormControlRenderer class. enhancer function The constructor for an instance of sync.formctrls.Enhancer that will be used to enhance form controls rendered by the specified Java renderer. removeAllListeners( [opt_type]) Removes all listeners from this listenable. If type is specified, it will only remove listeners of the particular type. otherwise all registered listeners will be removed. Parameters: Name Type Argument Description opt_type string &lt;optional&gt; Type of event to remove, default is to remove all types. Inherited From: goog.events.EventTarget#removeAllListeners Returns: Number of listeners removed. Type number reportFileNotFound() Report that the editor could not load the requested resource because it is missing. reportUnknownLoadingProblem(message [, opt_err]) Report that the editor could not load the requested resource because it is missing. Parameters: Name Type Argument Description message string The message that describes the problem. Can be empty. opt_err Error &lt;optional&gt; An error object that represents the cause of the error. If this object is given, the user will have the chance to report this problem and general troubleshooting info will be presented. reportUnkownLoadingProblem() Deprecated: Use sync.api.Editor#reportUnknownLoadingProblem instead. setDirty(dirty) Sets the editor status as modified or not. If the editor is modified, when the user leaves the page, we warn them that there are unsaved changes. Parameters: Name Type Description dirty boolean Whether the editor should be marked as dirty or not. setReadOnlyState(state) Sets the editor as read-only. Parameters: Name Type Description state sync.api.ReadOnlyState The read-only state. setReadOnlyStripeRenderer(renderer) Parameters: Name Type Description renderer function A function that renders the read-only status of a document. It will be called whenever the read-only status of the document changes. The first parameter is the read-only state of the document. The second parameter is the stripe element. triggerSave( [opt_resultHandler]) Triggers a save and receives information about its result. Note: plugins can overwrite the editor's \"save\" functionality. If the action with ID \"Author/Save\" is overwritten, the behaviour is not specified. Parameters: Name Type Argument Description opt_resultHandler function &lt;optional&gt; Save result handler. The first parameter is an error object with a type field - it is null if the operation was successful. The type is one of the following values: not_well_formed - The document is edited in text mode and not well formed. user_action_required - An user action is required to continue. Typically, the user has to log in again. session_expired_error - The editing session expired. io_error - Error when trying to save the file on the file server. The second parameter is the the result of the operation - true if successful, false otherwise. unlisten(type, listener [, opt_useCapture] [, opt_listenerScope]) Removes an event listener which was added with listen() or listenOnce(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#unlisten Returns: Whether any listener was removed. Type boolean Type Definitions onContentReceived(error [, content]) A callback invoked when the asynchronous request for the XML content finishes. If the operation is successful, the first parameter is null and the second one is a string that represents the content. If case of an error, the first parameter is an object describing the error. Parameters: Name Type Argument Description error Object The error object, or null if the request was successful. content string &lt;optional&gt; The serialized XML content. onXmlContentReceived(error, content) A callback invoked when the asynchronous request for the XML content finishes. If the operation is successful, the first parameter is null and the second one is a string that represents the content. If case of an error, the first parameter is an object describing the error. Parameters: Name Type Description error object The error object, or null if the request was successful. content string The serialized XML content. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.Editor.ActionsLoadedEvent.html":{"id":"sync.api.Editor.ActionsLoadedEvent.html","title":"Class: ActionsLoadedEvent","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.Acti  (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: ActionsLoadedEvent sync.api.Editor. ActionsLoadedEvent new ActionsLoadedEvent(actionsConfiguration) Configuration of the actions that are going to be enabled for the current editor was loaded. This configuration may specify some of the: the action together with their shortcuts the configuration of one of the toolbars the configuration of the context menu configuration for the content completion menu This event is triggered before the action are used, so changes to the configuration will take effect in the UI. The toolbar and contextmenu configurations contain only action ids. In order to change the actual actions or to add more actions one can use the sync.api.ActionsManager. Example of listening for this event: editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { // e is of type sync.api.Editor.ActionsLoadedEvent }); Parameters: Name Type Description actionsConfiguration sync.api.Editor.ActionsLoadedEvent.ActionsConfiguration A object that represents the actions configuration. Members actionsConfiguration :sync.api.Editor.ActionsLoadedEvent.ActionsConfiguration Type: sync.api.Editor.ActionsLoadedEvent.ActionsConfiguration type :string Type: string Type Definitions ActionDescriptor The action descriptor. Type: Object Properties: Name Type Argument Description compatible boolean Whether the action is compatible with webapp. If not, it will not be used in the UI. icon16 string &lt;optional&gt; The URL for a 16x16 icon to be used for the action. icon20 string &lt;optional&gt; The URL for a 24x24 icon to be used for the action. Yes, 24x24, it's called icon20 for backwards compatibility reasons. id string The unique ID of the action. name string &lt;optional&gt; The display name of the action. tooltip string &lt;optional&gt; The tooltip description of the action. shortcut string &lt;optional&gt; The shortcut of the action. Can use platform-generic modifiers: M1 - Ctrl or Cmd on Mac M2 - Shift M3 - Alt M4 - Ctrl on Mac, or nothing on other platforms ActionEntry The descriptor for an action entry on the toolbar or in the context menu. Type: Object Properties: Name Type Description id string The ID of the action to render on the toolbar. type string Equal to \"action\". ActionsConfiguration The object used to open the editor. Type: Object Properties: Name Type Argument Description actions Array.&lt;sync.api.Editor.ActionsLoadedEvent.ActionDescriptor&gt; An array of actions descriptors. toolbars Array.&lt;sync.api.Editor.ActionsLoadedEvent.ActionsListDescriptor&gt; An array of descriptors for actions lists that will be rendered as toolbars. contextualItems Array.&lt;sync.api.Editor.ActionsLoadedEvent.ContextMenuEntry&gt; An array of descriptors for entries in the context menu. filterCCItems Array.&lt;string&gt; &lt;nullable&gt; A list of names to filter from the Content Completion menu. This property is not always defined when the sync.api.Editor.ActionsLoadedEvent event is dispatched. Changes to this list are reflected in the UI only when this field is defined, not when you define it yourself. There are several types of entries Raw names of elements, for example p instead of the display name which is Paragraph. Entries that contain the &lt;SPLIT&gt; token to filter entries like \"Split Paragraph\" in all the supported languages. An entry equal &lt;ENTER&gt; to remove the \"Enter\" entry that appears for code-blocks. ActionsListDescriptor The descriptor for a toolbar, a drop-down menu on the toolbar, or context sub-menu. Type: Object Properties: Name Type Argument Description icon16 string &lt;optional&gt; The URL for a 16x16 icon to be used to render the actions list. icon20 string &lt;optional&gt; The URL for a 24x24 icon to be used to render the actions list. Yes, 24x24, it's called icon20 for backwards compatibility reasons. If the image is placed inside framework the absolute URL of the icon can be obtain by concatenating sync.ext.Registry.extensionURL. iconDom HTMLElement &lt;optional&gt; A DOM element that will be used to render the actions list. name string &lt;optional&gt; The name of the toolbar, used as an HTML attribute. It is used also a fallback for displayName. displayName string &lt;optional&gt; The display name of the toolbar. type string Equal to \"list\". small boolean true to render a small toolbar (with no padding). toBottom boolean true if the toolbar is placed at the bottom of the editor (in this case the drop-down arrow points to top). children Array.&lt;sync.api.Editor.ActionsLoadedEvent.ListEntry&gt; the list entries. ContextMenuEntry The context menu entry descriptor. Type: Object Properties: Name Type Argument Description icon string &lt;optional&gt; The URL for a 16x16 icon to be used for the toolbar. name string &lt;optional&gt; The display name of the toolbar. type string Equal to \"list\". children Array.&lt;sync.api.Editor.ActionsLoadedEvent.ListEntry&gt; the context menu entries entries. ListEntry An entry that can appear in the toolbar, toolbar dropdown menu, context menu or context sub-menu. Can be an action, a sub-menu, or a separator. Type: sync.api.Editor.ActionsLoadedEvent.ActionsListDescriptor | sync.api.Editor.ActionsLoadedEvent.ActionEntry | sync.api.Editor.ActionsLoadedEvent.Sep Sep A separator. Type: Object Properties: Name Type Description type string Equal to \"sep\". × Search results Close Do
