gersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: FileBrowsingDialog sync.api. FileBrowsingDialog new FileBrowsingDialog( [options]) Browsing dialog for files in a remote file repository. The file repositories suitable to be browsed using this dialog contain files that can be identified by URLs. The URLs should be composed of two parts: The file repository URL. E.g. the URL of a branch of a GitHub project, or an WebDAV server. When editing a file, browsing for external references link: images, content references, DITA Maps happens in the repository of the edited file. However, when trying to open or create a new file, the users should be allowed to change the file repository that they are using. The path to the file. In order to change the file path, users can navigate the hierarchical of the repository. Parameters: Name Type Argument Description options sync.api.FileBrowsingDialog.Options &lt;optional&gt; The options used to configure the File Browsing Dialog. Extends sync.api.UrlChooser Classes FolderEntryDescriptor UserActionRequiredEvent Members &lt;static&gt; DEFAULT_HEIGHT :number The default height for the filebrowser. (WA-312) Type: number &lt;static&gt; EventTypes :string Event types generated by the File Browser. Type: string Properties: Name Type Default Description USER_ACTION_REQUIRED string user_action_required The Event dispatched when some user action is required in order to be able to list the content of a folder. See sync.api.FileBrowsingDialog.UserActionRequiredEvent for more details. fileBrowserProps :sync.api.FileBrowsingDialog.Options The properties that control the file browser. Type: sync.api.FileBrowsingDialog.Options Methods chooseUrl(context, chosen, purpose) Invokes the URL chooser. Parameters: Name Type Description context sync.api.UrlChooser.Context The context in which the chooser is invoked - it contains information like the type of the resource that we want the user to choose: image, external xml file, etc. chosen sync.api.UrlChooser~urlChosen The function to be called with the result of the choice. purpose sync.api.UrlChooser.Purpose The purpose the chooser is invoked with. Inherited From: sync.api.FileBrowsingDialog#chooseUrl Overrides: sync.api.UrlChooser#chooseUrl clearFileBrowsingData() Clear the file browsing data (current url, selected url). getCurrentFolderUrl() Returns: the URL of the current folder. Type string getEventTarget() Getter for the url chooser's event target. Returns: target the object on which to listen for url chooser specific events. Type goog.events.EventTarget getFileName() Returns: The name of the selected file. Type string getRootUrl() Since: 20.1.1 Returns: The root URL of the file browser. Type string handleOpenRepo(element, e) Called when the repository configuration should be opened. Parameters: Name Type Description element HTMLElement The container element of the repo editing UI. e goog.events.Event The event that triggered the opening - you can cancel it. openUrl(url, isFile [, e]) Opens the following URL. If the URL denotes a File, the file is chosen. If the URL denotes a Folder, the dialog switches to that folder. Parameters: Name Type Argument Description url string The URL to open. isFile boolean true if the url points to a file rather than to a folder. e goog.events.Event &lt;optional&gt; The event that made you want to open the URL. If the call is made outside an event handler, pass null. refresh() Refresh the url chooser. Refresh the url chooser in case the chooser does not reflect the actual resource state. renderRepoEditing(element) Render the repo editing UI. Parameters: Name Type Description element HTMLElement The container element. renderRepoPreview(element) Render the repo preview UI. Parameters: Name Type Description element HTMLElement The container element. saveFile(fileURL, suggestedFileName, callback) Saves the file given file. IMPORTANT: Please consider overriding sync.api.UrlChooser#chooseUrl instead of this one. The default implementation for this method uses sync.api.UrlChooser#chooseUrl to determine the save location. An use-case for this method is to re-use a 'saver' widget which already takes care of the saving itself. Parameters: Name Type Description fileURL string the URL of the file to be saved. suggestedFileName string the proposed name for the new file. callback sync.api.UrlChooser~fileSaved the callback to be called with the saved file url. Inherited From: sync.api.UrlChooser#saveFile setRootUrl( [root]) Sets the root URL, above which navigation is prohibited. Parameters: Name Type Argument Description root string &lt;optional&gt; the root url of the server. showErrorMessage(message [, errorType]) Shows an error message inline. Parameters: Name Type Argument Description message string The error message. errorType InplaceNotificationReporter.types &lt;optional&gt; The type of the error message, error by default. supports(type) Checks whether the URL chooser supports choosing a given type of resource sync.api.UrlChooser.Type. If not supported, the default UI (which is usually a text-field) will be presented to the user. Parameters: Name Type Description type sync.api.UrlChooser.Type The type of the URL to be chosen. Inherited From: sync.api.FileBrowsingDialog#supports Overrides: sync.api.UrlChooser#supports Returns: true if the chooser supports the given type. Type boolean supportsOperation(purpose) Needs to be implemented to reflect whether the chooser suports the given operation: save or choose. Parameters: Name Type Description purpose sync.api.UrlChooser.Purpose The operation. Inherited From: sync.api.FileBrowsingDialog#supportsOperation Overrides: sync.api.UrlChooser#supportsOperation Returns: true if the given operation is supported. Type boolean switchToFileBrowsing() Switches the dialog into file browsing mode. switchToRepoConfig() Switches the dialog into repository configuration editing mode. Type Definitions Options options The options used to configure the file browsing dialog. Type: Object Properties: Name Type Argument Description options.root string &lt;optional&gt; The root url of the file repository on which the browsing will be performed. options.initialUrl string &lt;optional&gt; The URL of the folder where the dialog points to initially. options.listFolder sync.api.FileBrowsingDialog~listFolderFunction &lt;optional&gt; The function to call to retrieve files - by default the server-side ro.sync.net.protocol.FileBrowsingConnection.listFiles() method is called. listFolderFunction(folderUrl, successCalback, failureCallback) Callback that returns the contents of the given folder. Parameters: Name Type Description folderUrl string The URL of the folder to list. successCalback sync.api.FileBrowsingDialog~listFolderSuccessCallback The function to call when the folder listing is available. failureCallback function The function to call when there was a failure retrieving folder content, passing in the exception. listFolderSuccessCallback(folderEntries) Callback that receives the folder entries. Parameters: Name Type Description folderEntries Array.&lt;sync.api.FileBrowsingDialog.FolderEntryDescriptor&gt; The list of the URLs of the folder entries. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.FileBrowsingDialog.FolderEntryDescriptor.html":{"id":"sync.api.FileBrowsingDialog.FolderEntryDescriptor.html","title":"Class: FolderEntryDescriptor","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync. ddress (it may contain for example some branches information or it may render some server specific images) on the top part of the server browser component. It can also be used to render the editing components for the root URL. Parameters: Name Type Description rootUrl string The server root URL to render details for. rootURLChangedCallback sync.api.FileServer~serverURLsInfoCallback The function to call when the root URL is changed. readOnly boolean True if the root URL should not be editable by using this component. Returns: The HTML element that represents UI component. Type HTMLElement getDefaultRootUrl() Impose a default server to be browsed in the file server specific Dashboard tab. Returns: The default root URL. Type string getUrlInfo(url, urlInfoCallback, showErrorMessageCallback) Request the URL info from the file server. Parameters: Name Type Description url string The URL about which we ask for information. urlInfoCallback sync.api.FileServer~serverURLsInfoCallback The function to call when the URL info is available. showErrorMessageCallback sync.api.FileServer~showErrorMessageCallback The function to call when an error message must be presented to the user. getUserName() Get current user name. Returns: The current user name. Type string listFiles(folderUrl, successCallback, failureCallback) Get the contents of the given folder. By default the server-side ro.sync.net.protocol.FileBrowsingConnection.listFiles() method is called to retrieve files so this method should be used only if a custom implementation is needed. Parameters: Name Type Description folderUrl string The URL of the folder to list. successCallback sync.api.FileServer.listFilesSuccessCallback The function to call when the folder listing is available. failureCallback function The function to call when there was a failure retrieving folder content, passing in the exception. login(message, loginSuccessCallback, url) Login to the server. This method should implement both the UI used by the user to provide the login credentials and the login functionality. Parameters: Name Type Description message String The message received from the server, from the ro.sync.ecss.extensions.api.webapp.plugin.UserActionRequiredException that triggers the login action. loginSuccessCallback function The function to call after the log in process is finished successful. url String The url of the resource that requires the login action. logout(logoutCallback) Disconnect from server. This method should only implement the file server disconnect functionality, since it is called when a disconnect action is called (and after the user confirmation). Parameters: Name Type Description logoutCallback function The function to call when the file server logout process is completed. serverURLsInfoCallback(rootUrl, browseUrl) Callback that receives the server URLs information. Parameters: Name Type Description rootUrl string The server root URL browseUrl string The URL of the current folder whose content will be presented in the file browser. setUserChangedCallback(The) Set the callback to be called when the user name is changed. Parameters: Name Type Description The function callback function to be called when the user is changed (the name is send as parameter). showErrorMessageCallback(The) Callback that receives an error message that must be presented to the user Parameters: Name Type Description The string error message to be presented to the user. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.FileServer.EntryDescriptor.html":{"id":"sync.api.FileServer.EntryDescriptor.html","title":"Interface: EntryDescriptor","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync DescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: PersistentHighlightsManager sync.api. PersistentHighlightsManager new PersistentHighlightsManager() Manages custom persistent highlights. To get access to this manager use sync.api.AuthorEditingSupport#getPersistentHighlightsManager. The custom persistent highlights are serialized in the XML as processing instructions with the following form: &lt;?oxy_custom_start prop1=\"val1\"....?&gt; xml content &lt;?oxy_custom_end?&gt; This manager allows you to add a single highlight at a time, by using the async sync.api.PersistentHighlightsManager#addHighlight operation. If multiples highlights needs to be added in a single step, you can create an AuthorOperation that uses the server side ro.sync.ecss.extensions.api.highlights.AuthorPersistentHighlighter JAVA API. To listen for highlights updates register a listener on this manager: highlightsManager.listen(sync.api.PersistentHighlightUpdateEvent.EventType.HIGHLIGHT_ADDED, function(e) { }); highlightsManager.listen(sync.api.PersistentHighlightUpdateEvent.EventType.HIGHLIGHT_REMOVED, function(e) { }); Since: 22.1 Extends goog.events.EventTarget Methods addHighlight( [attributes], callback) Adds a custom highlight over the current selection. Parameters: Name Type Argument Description attributes Map.&lt;String, String&gt; &lt;optional&gt; The attributes of the highlight to be added on the HTML element generated for this highlight. The value of the \"className\" attribute will also be added to the class name list of the generated element. callback function The callback when the highlight is added. The callback's first argument is the error object or null; the second one is the id of the added highlight. addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. Inherited From: goog.Disposable#addOnDisposeCallback dispatchEvent(e) Dispatches an event (or event like object) and calls all listeners listening for events of this type. The type of the event is decided by the type property on the event object. If any of the listeners returns false OR calls preventDefault then this function will return false. If one of the capture listeners calls stopPropagation, then the bubble listeners won't fire. Parameters: Name Type Description e Object | goog.events.Event Event object. Inherited From: goog.events.EventTarget#dispatchEvent Returns: If anyone called preventDefault on the event object (or if any of the listeners returns false) this will also return false. Type boolean dispose() Disposes of the object. If the object hasn't already been disposed of, calls #disposeInternal. Classes that extend `goog.Disposable` should override #disposeInternal in order to delete references to COM objects, DOM nodes, and other disposable objects. Reentrant. Inherited From: goog.Disposable#dispose Returns: Nothing. Type void getAllHighlights() Get all highlights. Returns: The ids of all highlights. Type Array.&lt;string&gt; getHighlightAttributes(id) Get the attributes of a highlight. Parameters: Name Type Description id String The id of the highlight. Returns: The object representing the highlights attributes Type object getHighlightsAtCaret( [matchStartEnd]) Get all the custom persistent highlights at caret. Parameters: Name Type Argument Description matchStartEnd boolean &lt;optional&gt; If true, the results match markers that start / end at the given position (by default it's false). Returns: The ids of the highlights at caret. Type Array.&lt;string&gt; getHighlightSelection(highlightId) Ge the selection corresponding to a highlight Parameters: Name Type Description highlightId string The highlight id. Returns: The selection. Type sync.api.Selection | null getParentEventTarget() Returns the parent of this event target to use for bubbling. Inherited From: goog.events.EventTarget#getParentEventTarget Returns: The parent EventTarget or null if there is no parent. Type goog.events.EventTarget isDisposed() Inherited From: goog.Disposable#isDisposed Returns: Whether the object has been disposed of. Type boolean listen(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener. A listener can only be added once to an object and if it is added again the key for the listener is returned. Note that if the existing listener is a one-off listener (registered via listenOnce), it will no longer be a one-off listener after a call to listen(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listen listenOnce(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener that is removed automatically after the listener fired once. If an existing listener already exists, listenOnce will do nothing. In particular, if the listener was previously registered via listen(), listenOnce() will not turn the listener into a one-off listener. Similarly, if there is already an existing one-off listener, listenOnce does not modify the listeners (it is still a once listener). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listenOnce registerDisposable(disposable) Associates a disposable object with this object so that they will be disposed together. Parameters: Name Type Description disposable goog.disposable.IDisposable that will be disposed when this object is disposed. Inherited From: goog.Disposable#registerDisposable removeAllListeners( [opt_type]) Removes all listeners from this listenable. If type is specified, it will only remove listeners of the particular type. otherwise all registered listeners will be removed. Parameters: Name Type Argument Description opt_type string &lt;optional&gt; Type of event to remove, default is to remove all types. Inherited From: goog.events.EventTarget#removeAllListeners Returns: Number of listeners removed. Type number removeHighlights(ids, callback) Removes highlights. Parameters: Name Type Description ids Array.&lt;String&gt; The ids of the highlights to be removed. callback function The callback when the highlights are removed. The callback's argument is the error object or null. scrollToHighlight(highlightId) Scroll to a specific highlight. Parameters: Name Type Description highlightId String The id of the highlight to be selected. selectHighlight(highlightId) Select a specific highlight. Parameters: Name Type Description highlightId String The id of the highlight to be selected. unlisten(type, listener [, opt_useCapture] [, opt_listenerScope]) Removes an event listener which was added with listen() or listenOnce(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#unlisten Returns: Whether any listener was removed. Type boolean updateHighlight(id [, attributes], callback) Updates a highlight. Parameters: Name Type Argument Description id String The id of the highlight to update. attributes Map.&lt;String, String&gt; &lt;optional&gt; The attributes to be updated. If the map is null, the attributes remain unchanged. To remove an attribute, add it to the map with a null value. callback function The callback when the highlight update is done. The callback's first argument is the error object or null; the second one is the new id of the highlight. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.PersistentHighlightUpdateEvent.html":{"id":"sync.api.PersistentHighlightUpdateEvent.html","title":"Class: PersistentHighlightUpdateEvent","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api. ss: Selection sync.api. Selection new Selection() Author-specific selection. Methods &lt;static&gt; createAroundNode(node) Create a selection around the given node. Parameters: Name Type Description node Node The node which selection should wrap. Deprecated: use sync.api.SelectionManager#createAroundNode Returns: The selection object. Type sync.api.Selection &lt;static&gt; createEmptySelectionInNode(node, pos) Returns a selection that is empty and is located inside the given node, at the given position. Parameters: Name Type Description node Node The element, comment or PI in which the selection is positioned. pos string The position of the caret: 'before' means before all children nodes 'after' that means after all children nodes Deprecated: use sync.api.SelectionManager#createEmptySelectionInNode Returns: The selection. Type sync.api.Selection &lt;static&gt; createEmptySelectionRelativeToNode(node, offset [, opt_fromNodeEndTag]) Creates an empty selection at a position that is \"offset\" steps to the right of the start/end tag of the given \"node\". A step means either a content character, a start tag of a node or an end tag of a node. For example, with this XML content: &lt;p&gt;I &lt;b&gt;like&lt;/b&gt; XML.&lt;/p&gt; The following call: Selection.createEmptySelectionRelativeToNode(p, 5, true) Creates a position in the word \"like\" as presented below: &lt;p&gt;I &lt;b&gt;li|ke&lt;/b&gt; XML.&lt;/p&gt; Parameters: Name Type Argument Description node Node The element, comment or PI used as a reference for the selection position. offset number The number of steps to the right of the start/end tag of the reference node. opt_fromNodeEndTag boolean &lt;optional&gt; true, to create the selection relative to the end tag of the given node rather than to its start. Deprecated: use sync.api.SelectionManager#createEmptySelectionRelativeToNode extendedTo(node, offset [, opt_fromNodeEndTag]) Returns a new selection which is created by extending the current selection to the position that is \"offset\" steps to the right of the start/end tag of the given \"node\". A step means either a content character, a start tag of a node or an end tag of a node. For example, with this XML content, and the selection represented as a vertical line: &lt;p&gt;I &lt;b&gt;|like&lt;/b&gt; XML.&lt;/p&gt; The following call: var extendedSel = sel.extendedTo(p, 7, true) creates a new extended selection to select the word \"like\" as presented below: &lt;p&gt;I &lt;b&gt;|like|&lt;/b&gt; XML.&lt;/p&gt; Parameters: Name Type Argument Description node Node The element, comment, or PI used as a reference for the selection position. offset number The number of steps to the right of the start/end tag of the reference node. opt_fromNodeEndTag boolean &lt;optional&gt; true, to create the selection relative to the end tag of the given node rather than to its start. Returns: Type sync.api.Selection getCaretPositionInformation() Retrieve information about the caret position. The XML content is modeled as a sequence of items that can be either characters and XML (start or end ) tags. The caret is said to be positioned \"on\" a certain item if it is visually to the left of that item. Returns: Information about caret position. Type sync.api.PositionInformation getFullySelectedNode() Returns the element, comment or PI that is fully selected. Returns: The element, comment or PI which is fully selected. Type Node getNodeAtCaret( [opt_includeTextNodes]) Returns the node at caret if the selection is empty. If the caret is \"on\" sync.api.Selection#getCaretPositionInformation a start tag of an element \"X\", it is considered to be outside the node \"X\", so the returned node is the parent of \"X\". Parameters: Name Type Argument Description opt_includeTextNodes boolean &lt;optional&gt; If present and true will include text nodes. By default text nodes are ignored. Returns: The node at caret if the selection is empty. Type Node | null getNodeAtSelection( [opt_includeTextNodes]) Returns the node at the current selection. If the current selection is empty, the node in which the selection resides is returned. If the selection is around an entire node, that node will be returned. If the selection spans multiple nodes, the node where the selection has ended is returned. Parameters: Name Type Argument Description opt_includeTextNodes boolean &lt;optional&gt; If present and true will include text nodes. By default text nodes are ignored. Returns: The node at the current selection. Type Node getNodeAtSelectionEnd( [opt_includeTextNodes]) Returns the node at the current selection. If the current selection is empty, the node in which the selection resides is returned. If the selection is around an entire node, that node will be returned. If the selection spans multiple nodes, the node at the end of it. Parameters: Name Type Argument Description opt_includeTextNodes boolean &lt;optional&gt; If present and true will include text nodes. By default text nodes are ignored. Returns: The node at the current selection. Type Node getNodeAtSelectionStart( [opt_includeTextNodes]) Returns the node at the current selection. If the current selection is empty, the node in which the selection resides is returned. If the selection is around an entire node, that node will be returned. If the selection spans multiple nodes, the node at the start of it. Parameters: Name Type Argument Description opt_includeTextNodes boolean &lt;optional&gt; If present and true will include text nodes. By default text nodes are ignored. Returns: The node at the current selection. Type Node × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.SelectionCore.html":{"id":"sync.api.SelectionCore.html","title":"Class: SelectionCore","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goo dcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: UrlChooser sync.api. UrlChooser new UrlChooser() A base class for URL choosers. Classes Context Members &lt;static&gt; Purpose :string The type of the URL to be chosen. Type: string Properties: Name Type Default Description SAVE string save The purpose of the chooser is to help the user save the specified resource. CHOOSE_SAVE_LOCATION string choose_save_location The purpose of the chooser is to choose a location where to save the given file. CHOOSE string choose The purpose of the chooser is to choose the location of a resource. &lt;static&gt; SaveResult :string Information about the save operation result. Type: string Properties: Name Type Default Description SAVED_AVAILABLE_URL string saved-and-available The save operation was successful and the file url is available. SAVED_UNAVAILABLE_URL string saved-unavailable The save operation was successful but the file url is not available, or cannot be determined by the urlChoser. FAILED string save-failed The save operation failed for some reason. CANCELED string save-canceled &lt;static&gt; Type :string The type of the URL to be chosen. Type: string Properties: Name Type Default Description IMAGE string image The URL corresponds to an image resource. EXTERNAL_REF string xref The URL corresponds to an XML file that is referred from the currently edited one. DITA string dita The URL corresponds to a DITA topic or map resource. DITAMAP string ditamap The URL corresponds to a DITA map resource. DITAVAL string ditaval The URL corresponds to a DITA filter (ditaval) resource. DITAPROJECT string ditaproject The URL corresponds to a DITA project resource. GENERIC string generic The URL corresponds to another type of resource. Methods &lt;static&gt; getFileBrowserDescriptor() Gets the current file browser descriptor containing all filtering configuration. Since: 28.1 Returns: The current file browser descriptor containing all URL chooser type filtering configurations. Type sync.api.FileBrowserDescriptor &lt;static&gt; setFileBrowserDescriptor(descriptor) Sets the complete file browser descriptor, replacing all existing filtering configuration. Parameters: Name Type Description descriptor sync.api.FileBrowserDescriptor The file browser descriptor containing all URL chooser type filtering configurations. Since: 28.1 chooseUrl(context, chosen, purpose) Invokes the URL chooser. Parameters: Name Type Description context sync.api.UrlChooser.Context The context in which the chooser is invoked - it contains information like the type of the resource that we want the user to choose: image, external xml file, etc. chosen sync.api.UrlChooser~urlChosen The function to be called with the result of the choice. purpose sync.api.UrlChooser.Purpose The purpose the chooser is invoked with. saveFile(fileURL, suggestedFileName, callback) Saves the file given file. IMPORTANT: Please consider overriding sync.api.UrlChooser#chooseUrl instead of this one. The default implementation for this method uses sync.api.UrlChooser#chooseUrl to determine the save location. An use-case for this method is to re-use a 'saver' widget which already takes care of the saving itself. Parameters: Name Type Description fileURL string the URL of the file to be saved. suggestedFileName string the proposed name for the new file. callback sync.api.UrlChooser~fileSaved the callback to be called with the saved file url. supports(type) Checks whether the URL chooser supports choosing a given type of resource sync.api.UrlChooser.Type. If not supported, the default UI (which is usually a text-field) will be presented to the user. Parameters: Name Type Description type sync.api.UrlChooser.Type The type of the URL to be chosen. Returns: true if the chooser supports the given type. Type boolean supportsOperation(purpose) Needs to be implemented to reflect whether the chooser suports the given operation: save or choose. Parameters: Name Type Description purpose sync.api.UrlChooser.Purpose The operation. Returns: true if the given operation is supported. Type boolean Type Definitions fileSaved( [url], resultInfo [, errorMessage]) A callback invoked when the file is saved. Parameters: Name Type Argument Description url string &lt;optional&gt; The URL where the file was saved, or null if the location is not available. resultInfo sync.api.UrlChooser.SaveResult information about the save operation result. errorMessage string &lt;optional&gt; The error message in case the resultInfo is sync.api.UrlChooser.SaveResult.FAILED. urlChosen( [url]) A callback invoked when the user choice is available. Parameters: Name Type Argument Description url string &lt;optional&gt; The URL chosen by the user, or null if the user failed to choose anything. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.api.UrlChooser.Context.html":{"id":"sync.api.UrlChooser.Context.html","title":"Class: Context","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.Editi ace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: Workspace sync.api. Workspace new Workspace() Access to the Workspace in which the editor is opened. Extends goog.events.EventTarget Classes BeforeEditorOpenedEvent DashboardLifecycleEvent EditorLifecycleEvent Members &lt;static&gt; EventType :string The types of the sync.api.Workspace events. Type: string Properties: Name Type Default Description BEFORE_EDITOR_LOADED string before_editor_loaded Triggered before the editor content was loaded. Note that frameworks code cannot use this event since the framework is detected while the document is loaded. See sync.api.Workspace.BeforeEditorOpenedEvent for more details. EDITOR_LOADED string editor_loaded Triggered after the editor was loaded. See sync.api.Workspace.EditorLifecycleEvent for more details. EDITOR_LOADING_FAILED string editor_loading_failed Triggered after the editor was loaded. See sync.api.Workspace.EditorLifecycleEvent for more details. EDITOR_DISPOSED string editor_disposed Triggered when the editor was disposed. See sync.api.Workspace.EditorLifecycleEvent for more details. BEFORE_EDITOR_DISPOSED string before_editor_disposed Triggered before the editor will be disposed. See sync.api.Workspace.EditorLifecycleEvent for more details. BEFORE_DASHBOARD_LOADED string before_dashboard_loaded Triggered before the dashboard is loaded. See sync.api.Workspace.DashboardLifecycleEvent for more details. DASHBOARD_LOADED string dashboard_loaded Triggered after the dashboard was loaded. See sync.api.Workspace.DashboardLifecycleEvent for more details. Methods &lt;static&gt; createEditorStripe(height [, first] [, below]) Create and add a stripe above/below the editor. Parameters: Name Type Argument Description height number The height of the stripe in pixels. first boolean &lt;optional&gt; Flag that causes the stripe to be added first (false by default). below boolean &lt;optional&gt; Flag that causes the stripe to be added below the editor (false by default). Since: 26 Returns: The stripe element. Type Element addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. Inherited From: goog.Disposable#addOnDisposeCallback addRelativeReferencesResolver(protocol, resolver) Web Author prefers to insert the external references as relative URLs. It has a default algorithm to make an URL relative to a given base. However, you for certain URL protocols you can provide your own algorithm. Parameters: Name Type Description protocol string The protocol handled by the resolver. resolver function The relative references resolver. The first argument the URL used as a base for relativization and the second one is is the URL to make relative . createDialog( [opt_id]) Creates a dialog that can have custom content and behavior. The advantage of using this method is that the dialog will have a consistent appearance with the rest of the application and that it will work on all devices supported by the WebApp. Parameters: Name Type Argument Description opt_id string &lt;optional&gt; The id that will be given to the dialog box. For example, you can use it for specifying the width of the dialog in CSS. Returns: The dialog. Type sync.api.Dialog dispatchEvent(e) Dispatches an event (or event like object) and calls all listeners listening for events of this type. The type of the event is decided by the type property on the event object. If any of the listeners returns false OR calls preventDefault then this function will return false. If one of the capture listeners calls stopPropagation, then the bubble listeners won't fire. Parameters: Name Type Description e Object | goog.events.Event Event object. Inherited From: goog.events.EventTarget#dispatchEvent Returns: If anyone called preventDefault on the event object (or if any of the listeners returns false) this will also return false. Type boolean dispose() Disposes of the object. If the object hasn't already been disposed of, calls #disposeInternal. Classes that extend `goog.Disposable` should override #disposeInternal in order to delete references to COM objects, DOM nodes, and other disposable objects. Reentrant. Inherited From: goog.Disposable#dispose Returns: Nothing. Type void getEditingContextManager() Return the editing context manager. Returns: The editing context manager. Type sync.api.EditingContextManager getEditingSupportManager() Returns the editing support manager that can be used to create a specific sync.api.EditingSupport to the current editor. Since: 21.1.1 Returns: The editing support manager. Type sync.api.EditingSupportManager getFileServersManager() Returns the file servers manager helper object that can be used to register a descriptor that provides rendering information and file browsing functionality for a specific file server. Since: 20.1.1 Returns: The file servers manager. Type sync.api.FileServersManager getNotificationManager() Returns an object that can be used to display notifications to the user. Returns: the notifications manager. Type sync.api.NotificationsManager getOption(optionKey, defaultValue) Client options getter function. Parameters: Name Type Description optionKey string {sync.api.Workspace.Options} property name. defaultValue string the default value to be returned in case the option is not set. Returns: the set option. In case the option is not set it returns the defaultValue or null. Type string getParentEventTarget() Returns the parent of this event target to use for bubbling. Inherited From: goog.events.EventTarget#getParentEventTarget Returns: The parent EventTarget or null if there is no parent. Type goog.events.EventTarget getUrlChooser() Returns the URL chooser used when the user is asked to provide an URL. Returns: The currently registered URL chooser. Type sync.api.UrlChooser getViewManager() Returns the view manager helper object that can be used to customize Oxygen XML Web Author views. Returns: The view manager. Type sync.view.ViewManager isDisposed() Inherited From: goog.Disposable#isDisposed Returns: Whether the object has been disposed of. Type boolean listen(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener. A listener can only be added once to an object and if it is added again the key for the listener is returned. . 'validate.as.you.type' string &lt;optional&gt; Whether automatic validation should be enabled. Defaults to true. ccOnEnter string &lt;optional&gt; Flag that controls whether the content completion list is presented when the user press 'Enter'. Has precedence over the value of \"Show content completion list on Enter\" server option (controlled from \"General\" option page). elementNameEnhancer sync.api.ElementNameEnhancer &lt;optional&gt; A function which can enhance the name of elements depending on their attributes. 'stylesheet-titles' string | Array.&lt;string&gt; A list of titles of CSS groups (defined in the framework) that will be used to render the document. The list can be passed either as a JS array or concatenated as a comma-separated string. expandTopicRefs boolean &lt;optional&gt; If set to true, when a DITA map is opened in Oxygen XML Web Author, the content of all topics referenced in the map will be presented. KeyscopeStack string &lt;optional&gt; (DITA-specific Parameter) Used for resolving keys when DITA 1.3 key scopes are defined in the DITA map. The value looks like this: `a b c,d e f` for a DITA map that has the key scope defined like this: backupTimeout number &lt;optional&gt; The time to wait, after an edit, before making a backup. compactTagsMode boolean &lt;optional&gt; Flag that controls whether the consecutive block tags are displayed on the same line (when the value is true) or on separate lines (when the value is false). Default value is true. quickUpDownNavigation boolean &lt;optional&gt; This option is false by default and this means that when the user navigates using the up and down arrow keys, the cursor is placed within each of the underlying XML elements between two blocks of text (the cursor changes to a horizontal line when it is between blocks of text). This allows to easily insert elements and manage the structure of the XML content. However, if this option is true, the cursor ignores the XML structure and jumps from one line of text to another, similar to how the cursor behaves in a word processor. textModeReadOnly boolean &lt;optional&gt; Flag that controls whether the text mode will be read-only. Defaults to false. readOnlyState string | Object Can be either the string `read-only` or an object with a `reason` field that contains a message to be displayed in the user interface and a `code` that can be used, for example, when rendering the read-only stripe of the editor {@see sync.api.Editor#setReadOnlyStripeRenderer}. The `code` is a way to encode the `reason` that does not change according the the UI locale. 'schematron.imposed.phase' string &lt;optional&gt; Used to impose a phase with that name in any Schematron file used for validation. schematronUrl string &lt;optional&gt; (Markdown only) Used to specify a Schematron file to validate the Markdown file with. It will only work for Markdown files, if the Markdown editing plugin is installed. showDitaMapView boolean &lt;optional&gt; (DITA-specific Parameter) whether to show the DITA Map View on load. editReferencesInPlace boolean &lt;optional&gt; (DITA-specific Parameter) allow inplace editing for referred content. If the opened document is a DITA Map, the content of all topics referenced in the map will be presented in the editor and it will be possible to be edited. Defaults to false. outlinePlacement string &lt;optional&gt; Controls the side where the outline will be shown. Possible values: right left showTopicTitles boolean &lt;optional&gt; (DITA Map-specific Parameter) whether to resolve the topic titles for DITA Maps. Defaults to false. multipleNonFoldedChildren boolean &lt;optional&gt; `true` to display all children whose names are listed in the `-oxy-not-foldable-child` CSS property. `false` to display only the first one. `true` by default. roomId string &lt;optional&gt; The ID of the concurrent editing room to join. This option should be added besides the usual `url` parameter that specifies the URL of the document. sharedSessi en it is active but it does not have focus. Type: string editingSupport :sync.api.EditingSupport The editing support of the containing editor. Type: sync.api.EditingSupport formControl :HTMLElement The HTML element to enhance. Type: HTMLElement Methods enhanceDom() Method called to enhance an HTML element that wraps the form control. This should be implemented in subclasses. This method may be called on another instance of the form control than the two other methods, enterDocument &amp; exitDocument. enterDocument(controller) Method called to initialize the HTML element after it entered the DOM. This method should be implemented in subclasses to register event handlers on the form-control. IMPORTANT: It is advisable to call the 'super' method in your implementation. See explanation below. The editor that embeds the form controls usually calls preventDefault on any browser event on the 'bubble' phase. However, the default implementation of this method, listens to these events and calls 'stopPropagation' on them on the 'bubble' phase, so that the editor's listener which calls 'preventDefault' does not run. This enables the form control to benefit from native input events: typing, mouse clicks, drag&amp;drop, etc. Parameters: Name Type Description controller Controller The document controller. exitDocument() Method called to before the form-control is removed from the document. This should be implemented in subclasses to remove all the listeners on that element, and to reset any global state that refers to that element. The default implementation un-registers all the listeners on the form-control registered using the Closure library. getParentNode() Returns the XML node on which the form control is placed. Returns: the node on which the form control is placed. Type Node isDisabled() Getter for the 'disabled' state of the form control. By default, the form control is disabled when is in read-only context. A read-only context may be: a non-editable node when the '-oxy-editable' CSS rule is used a XML node deleted with change tracking enabled the whole 'Editor' when 'sync.api.ReadOnlyState' mark it as read-ony Returns: true if the form control is disabled, false otherwise. Type Boolean &lt;abstract&gt; recycleFor(newRendering) Recycle the enhancer for the new server-side rendering of the form control Parameters: Name Type Description newRendering HTMLElement The new server-side rendering. Returns: true if the enhancer can be recycled. Type boolean × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.options.html":{"id":"sync.options.html","title":"Namespace: options","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.Pers UserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: ViewManager sync.view. ViewManager new ViewManager() Helper object used to control the lateral views. The view manager can be obtained by using workspace.getViewManager(). Each view is identified by an ID and is registered on one of the two sides of the editor: left or right. A view is not visible before a sync.view.ViewRenderer is installed for it. Each view is enabled by default, and it can be disabled if it does not support the current editor. When the view is disabled, it will not be presented to the user, but it will still be present in the page's DOM. Once visible, the view may be focused or not. There is only one focused view on each side of the editor. Methods addView(viewId) Adds a new view with the given ID. The view is not rendered until a sync.view.ViewRenderer is installed for it. Should be called before any view is installed. Parameters: Name Type Description viewId string The id of the view to be added. disableView(viewId) Disables a view, which means the view is hidden from the user and can be enabled later. To enable or disable a view based on the current editor, one should use the sync.view.ViewRenderer#supportsEditor method. This method should only be used for more complex cases. Parameters: Name Type Description viewId string The id of the view to be disable. Since: 21.1.1 enableView(viewId) Enables a view, which means the view is displayed and can be interacted with by the user. To enable or disable a view based on the current editor, one should use the sync.view.ViewRenderer#supportsEditor method. This method should only be used for more complex cases. Parameters: Name Type Description viewId string The id of the view to be enabled. Since: 21.1.1 focusView(viewId) Focuses the view with the given ID. Has no effect if the view is disabled. Parameters: Name Type Description viewId string The ID of the view to focus. derer to uninstall. Since: 21.1.1 × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"sync.view.ViewRenderer.html":{"id":"sync.view.ViewRenderer.html","title":"Class: ViewRenderer","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Class: ViewRenderer sync.view. ViewRenderer new ViewRenderer() Base class for Oxygen XML Web Author views. Extends goog.events.EventTarget Methods addOnDisposeCallback(callback [, opt_scope]) Invokes a callback function when this object is disposed. Callbacks are invoked in the order in which they were added. If a callback is added to an already disposed Disposable, it will be called immediately. Parameters: Name Type Argument Description callback function The callback function. opt_scope T &lt;optional&gt; An optional scope to call the callback in. Inherited From: goog.Disposable#addOnDisposeCallback closed() Callback when the view is hidden from the user. This may include collapsing it, switching to another another view in a tabbed view container, etc. dispatchEvent(e) Dispatches an event (or event like object) and calls all listeners listening for events of this type. The type of the event is decided by the type property on the event object. If any of the listeners returns false OR calls preventDefault then this function will return false. If one of the capture listeners calls stopPropagation, then the bubble listeners won't fire. Parameters: Name Type Description e Object | goog.events.Event Event object. Inherited From: goog.events.EventTarget#dispatchEvent Returns: If anyone called preventDefault on the event object (or if any of the listeners returns false) this will also return false. Type boolean dispose() Disposes of the object. If the object hasn't already been disposed of, calls #disposeInternal. Classes that extend `goog.Disposable` should override #disposeInternal in order to delete references to COM objects, DOM nodes, and other disposable objects. Reentrant. Inherited From: goog.Disposable#dispose Returns: Nothing. Type void editorChanged(editor) Callback received when the focused editor was changed. When the view renderer is installed, there might be no editor loaded. However, if the editor is already loaded when install is called, this method is called immediately after install. The view is not notified when the editor is disposed, but it can listen for the sync.api.Editor.EventTypes.DISPOSE event. This method is not called if the given editor is not supported, i.e. sync.view.ViewRenderer#supportsEditor returns false. Parameters: Name Type Description editor sync.api.Editor The new editor. focus() Method called to focus the current view. &lt;protected&gt; getIcon( [devicePixelRatio]) One should override this method to provide the absolute URL of the action's large icon. If you want to distribute the icon in a framework, you need to place it in the \"web/\" sub-folder of the framework. In this case the absolute URL of the icon can be obtained by concatenating sync.ext.Registry.extensionURL with the relative path of the icon to the \"web/\" sub-folder. If you want to distribute the icon in a plugin, you can place it in a directory with static resources using a WebappStaticResourcesFolder extension. The icon should have a minimum size of 24 by 24 px for non-hidpi displays and can vary depending on the device pixel ration, the icon being used as the background of a 24 by 24 px DIV. Parameters: Name Type Argument Description devicePixelRatio number &lt;optional&gt; the device pixel ratio. Returns: The icon URL. Type string | null getParentEventTarget() Returns the parent of this event target to use for bubbling. Inherited From: goog.events.EventTarget#getParentEventTarget Returns: The parent EventTarget or null if there is no parent. Type goog.events.EventTarget getTitle() Returns the title of the view. Returns: The title of the view. Type string getToolbarActionsMap() Returns a map of actions used to create an action manager for the view's toolbar. If it is not provided, the editor's action manager will be used. ********************************* EXPERIMENTAL - Subject to change ******************************** Please note that this API is not marked as final and it can change in one of the next versions of the application. If you have suggestions, comments about it, please let us know. Returns: Map from action id to actions Type Object.&lt;string, sync.actions.AbstractAction&gt; getToolbarDescriptor() Returns the toolbar descriptor for the view. This toolbar will be shown in the view's header. ********************************* EXPERIMENTAL - Subject to change ******************************** Please note that this API is not marked as final and it can change in one of the next versions of the application. If you have suggestions, comments about it, please let us know. Returns: The toolbar's descriptor Type sync.api.Editor.ActionsLoadedEvent.ActionsListDescriptor install(element) This method is called when the view renderer is linked to the actual place where the view will be rendered. Parameters: Name Type Description element HTMLElement The element. isDisposed() Inherited From: goog.Disposable#isDisposed Returns: Whether the object has been disposed of. Type boolean listen(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener. A listener can only be added once to an object and if it is added again the key for the listener is returned. Note that if the existing listener is a one-off listener (registered via listenOnce), it will no longer be a one-off listener after a call to listen(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listen listenOnce(type, listener [, opt_useCapture] [, opt_listenerScope]) Adds an event listener that is removed automatically after the listener fired once. If an existing listener already exists, listenOnce will do nothing. In particular, if the listener was previously registered via listen(), listenOnce() will not turn the listener into a one-off listener. Similarly, if there is already an existing one-off listener, listenOnce does not modify the listeners (it is still a once listener). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#listenOnce opened() Callback when the view is shown to the user. This may include expanding it, switching the tab of this view in a tabbed view container, etc. To check the initial state of the view, when it is installed, use sync.view.ViewManager.isViewOpen. registerDisposable(disposable) Associates a disposable object with this object so that they will be disposed together. Parameters: Name Type Description disposable goog.disposable.IDisposable that will be disposed when this object is disposed. Inherited From: goog.Disposable#registerDisposable removeAllListeners( [opt_type]) Removes all listeners from this listenable. If type is specified, it will only remove listeners of the particular type. otherwise all registered listeners will be removed. Parameters: Name Type Argument Description opt_type string &lt;optional&gt; Type of event to remove, default is to remove all types. Inherited From: goog.events.EventTarget#removeAllListeners Returns: Number of listeners removed. Type number renderIcon() This method renders the icon of the view in a 24px by 24px div. This allows the getIcon() method to return different sized icons depending on the device pixel ration, the size constraints being imposed by the enclosing DIV. It should be overridden only for custom rendering strategies, otherwise consider using the getIcon method. Returns: the rendering of the view icon. Type Element supportsEditor(editor) Method used to determine if a given editor is supported. If supported, sync.view.ViewRenderer#editorChanged will be called for that editor. The default implementation of this method returns true only for Author editors. If a view does not support an editor, it will be disabled. To enable it later one can use sync.view.ViewManager#enableView. Parameters: Name Type Description editor sync.api.Editor The editor to check support for. Since: 21.1.1 Returns: returns true if the given editor is supported. Type boolean unlisten(type, listener [, opt_useCapture] [, opt_listenerScope]) Removes an event listener which was added with listen() or listenOnce(). Parameters: Name Type Argument Description type string The event type id. listener function Callback method. opt_useCapture boolean &lt;optional&gt; Whether to fire in capture phase (defaults to false). opt_listenerScope SCOPE &lt;optional&gt; Object in whose scope to call the listener. Inherited From: goog.events.EventTarget#unlisten Returns: Whether any listener was removed. Type boolean × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"Text.html":{"id":"Text.html","title":"Interface: Text","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.Web g called, with a node, i.e. the one passed as a parameter, with regard to their position in the document and according to the document order. Parameters: Name Type Description other Node The node to compare to. Inherited From: Node#compareDocumentPosition Returns: A bitmask with the following values from the Node class: DOCUMENT_POSITION_CONTAINED_BY - The node is contained by the reference node. A node which is contained is always following, too. DOCUMENT_POSITION_CONTAINS - The node contains the reference node. A node which contains is always preceding, too. DOCUMENT_POSITION_DISCONNECTED - The two nodes are disconnected. Order between disconnected nodes is always implementation-specific. DOCUMENT_POSITION_FOLLOWING - The node follows the reference node. DOCUMENT_POSITION_IMPLEMENTATION_SPECIFIC - The determination of preceding versus following is implementation-specific. DOCUMENT_POSITION_PRECEDING - The second node precedes the reference node. Type number hasAttributes() Returns true if the node has attributes. Inherited From: Node#hasAttributes Returns: if the node has attributes. Type true hasChildNodes() Returns whether this node has any children. Inherited From: Node#hasChildNodes Overrides: Node#hasChildNodes Returns: true if the node has child nodes. Type boolean isEqualNode(other) Test if two nodes have the same structure. Parameters: Name Type Description other Node The node to compare to. Inherited From: Node#isEqualNode Returns: true if the two nodes have the same structure. Type boolean isSameNode(other) The API may return different JS DOM objects for the same XML node - to detect this case, use this method. Parameters: Name Type Description other Node The node to compare to. Inherited From: Node#isSameNode Returns: true if the two objects represent the same XML node. Type boolean lookupNamespaceURI(prefix) Look up the namespace URI associated to the given prefix, starting from this node. Parameters: Name Type Description prefix string The URI of the in the contextual menu, or on an oxy_button form control. Implementing the action Suppose you want an action that converts a piece of XML content to a web link in DITA. The action will have to extend the sync.actions.AbstractAction class. Here is a sample implementation: /** * The action that shows a popup and then inserts the text in the pop-up. */ class WebLinkAction extends sync.actions.AbstractAction { /** * @type {sync.api.Editor} editor The editor object. * */ constructor(editor) { // shortcut is Meta+L on Mac and Ctrl+L on other platforms. super(editor, 'M1 L'); this.editor = editor; } /** @override */ getDisplayName() { return 'Convert to Web Link'; } /** @override */ isEnabled() { // The action is enabled only if there is some content selected. return !this.editor.getSelectionManager().getSelection().isEmpty(); } /** @override */ actionPerformed(callback) { var text = window.prompt(\"Please enter the link attribute\"); if (text) { this.editor.getActionsManager().invokeOperation( 'ro.sync.ecss.extensions.commons.operations.SurroundWithFragmentOperation', { fragment: '&lt;' + 'xref href=\"' + text + '\"/&gt;' }, callback); } else { callback &amp;&amp; callback(); } } } The action needs to be registered with the editor. This should be done before the editor is loaded so that the shortcut starts working immediately: workspace.listen(sync.api.Workspace.EventType.BEFORE_EDITOR_LOADED, function(e) { var editor = e.editor; // Register the newly created action. editor.getActionsManager().registerAction('insert.link', new WebLinkAction(editor)); addToDitaToolbar(editor, 'insert.link'); // or addToDitaToolbarDropdown(editor, 'insert.link'); addToContextMenu(editor, 'insert.link'); }); workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { var editor = e.editor; // Refresh the action enabled/disabled status when the selection changes. editor.getSelectionManager().listen( sync.api.SelectionManager.EventType.SELECTION_CHANGED, function() { editor.getActionsManager().refreshActionsStatus('insert.link') }); }); Adding the Action in the Editor User Interface Suppose that you want to add the action on the DITA toolbar. To this end, you need to wait for the toolbar to be loaded and append the action to it: function addToDitaToolbar(editor, actionId) { editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { var actionsConfig = e.actionsConfiguration; var ditaToolbar = null; if (actionsConfig.toolbars) { for (var i = 0; i &lt; actionsConfig.toolbars.length; i++) { var toolbar = actionsConfig.toolbars[i]; if (toolbar.name === \"DITA\") { ditaToolbar = toolbar; } } } if (ditaToolbar) { ditaToolbar.children.push({ id: actionId, type: \"action\" }); } }); } If you want to add the action on the DITA toolbar, in a dropdown, you can create a toolbar dropdown list descriptor like this: function addToDitaToolbarDropdown(editor, actionId) { editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { var actionsConfig = e.actionsConfiguration; var ditaToolbar = null; if (actionsConfig.toolbars) { for (var i = 0; i &lt; actionsConfig.toolbars.length; i++) { var toolbar = actionsConfig.toolbars[i]; if (toolbar.name === \"DITA\") { ditaToolbar = toolbar; } } } if (ditaToolbar) { ditaToolbar.children.push({ type: 'list', // type: list means this is a dropdown, all of its children will be shown when it is expanded name: 'Dropdown', // If no iconDom is provided the dropdown will display this name. iconDom: document.createElement('div'), // A DOM element that can be styled as needed. children: [{id: actionId, type: \"action\" }] // a list of action descriptors }); } }); } To also add the action in the contextual menu, a similar procedure is used: function addToContextMenu(editor, actionId) { editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { var contextualItems = e.actionsConfiguration.contextualItems; if (contextualItems) { contextualItems.push({ id: actionId, type: \"action\" }); } }); } To add the action on an oxy_button form control, one needs to make sure that the action is registered before te form controls are rendered. Otherwise, the button label is set to Unknown There are two approaches: Register the action on the sync.api.Workspace.EventType.BEFORE_EDITOR_LOADED event. Define an action stub in the framework configuration with the same ID that defines the name and the icon and overwrite it in JavaScript on the sync.api.Editor.EventTypes.ACTIONS_LOADED event. The action should now appear in the user interface. To use it: select some text click the action button on the toolbar enter the link target address confirm the prompt The text should now be converted to a web link. More Advanced Use-cases For a better UX, instead of a native browser prompt, you can use a custom JavaScript dialog box. You can find more details in the Presenting a Dialog to the User tutorial. If the dialog requires the user to provide a reference to a file, you can invoke workspace.getUrlChooser() to obtain a reference to the CMS-specific file chooser. For the actual document edit usually the InsertFragmentOperation or SurroundWithFragmentOperation is enough. If not, you can also have a look at other builtin operations in the JavaDoc or even implement your own subclass of AuthorOperation. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-customattributeaction.html":{"id":"tutorial-customattributeaction.html","title":"Tutorial: Implementing a Custom Action for Editing an Attribute Value","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.O ting a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Implementing a Custom Action for Editing an Attribute Value To provide custom functionality for editing attributes values in the Attributes View, you can implement a custom attribute action provider. This allows you to define how specific attributes should be edited when users interact with them. Implementing the Attribute Action Provider Suppose you want to provide a custom URL chooser when editing href attributes. Here's how you can implement this: workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { e.editor.registerAttributeActionsProvider({ getAction: function(elem, attr) { var action = null; if (attr === 'href') { action = new sync.actions.AttributeEditingAction(function(currentValue, done) { // Show the url chooser. var context = new sync.api.UrlChooser.Context(sync.api.UrlChooser.Type.GENERIC); var urlChooser = workspace.getUrlChooser(); var urlChoosen = function(url) { if (url === null) { // Do not change anything. done(currentValue); } else { done(url, true); } }; urlChooser.chooseUrl(context, urlChoosen, sync.api.UrlChooser.Purpose.CHOOSE); }, 'Open24'); } return action; } }); }); This code does the following: Listens for the EDITOR_LOADED event to ensure the editor is ready Registers an attribute actions provider using registerAttributeActionsProvider Implements the getAction method that returns a custom action for specific attributes For href attributes, creates an AttributeEditingAction that: Shows a URL chooser dialog Handles the URL selection result Updates the attribute value with the chosen URL How It Works When a user interacts with an attribute in the Attributes View: The editor checks if there's a custom action provider registered for that attribute If found, a special edit button appears next to the attribute's value field When the user clicks this button, the editor calls the getAction method with the current element and attribute name If the provider returns an action for that attribute, it's used instead of the default attribute editor The action's callback is executed, which can show custom UI (like a URL chooser) for editing the attribute Once the user completes the action (e.g., selects a URL), the attribute value is updated with the new value This provides a more intuitive way to edit complex attributes, as users can easily identify which attributes have special editing capabilities through the presence of the edit button. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-customview.html":{"id":"tutorial-customview.html","title":"Tutorial: Customizing the Side Views","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocume
