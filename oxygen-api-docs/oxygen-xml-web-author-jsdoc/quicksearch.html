ustom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Customizing the Side Views Oxygen XML Web Author includes support for side views that can improve the editing experience for users by providing more information about the edited document. The JavaScript API provides control over which views are rendered, and provides support for installing a new view from either a plugin or a document framework. Removing a View To disable the Review side view, simply include the following code snippet at the top of the JavaScript plugin file: workspace.getViewManager().removeView('review-panel-list'); To obtain a list with the IDs of all the defined views, type the following code in the browser console: workspace.getViewManager().getViewIds(); Installing a Custom View To implement a custom view, first you need to add it in the layout by calling the following code snippet when your plugin is loaded: workspace.getViewManager().addView('cms-custom-view'); Next you need to implement a view renderer. The following is a simple example of such a view renderer: /** * Example CMS View Renderer */ class MyViewRenderer extends sync.view.ViewRenderer { /** @override */ getTitle() { return 'Custom View'; }; /** @override */ install(element) { element.innerHTML = 'Welcome to my view'; }; } For more customization options for a view renderer, see the sync.view.ViewRenderer class. Later, when you want to actually render the custom view, you should install a view renderer for it. You can also specify if the view should be closed when the editor is opened, and the side where to install the view: let viewProperties = {initiallyClosed: false, side: 'right'}; workspace.getViewManager().installView('cms-custom-view', new MyViewRenderer(), viewProperties); Contributing a Custom View from a Framework Framework custom code is executed after the view layout is created. The good news is that several views are reserved for frameworks to use. Their IDs are 'framework-specific-N' (with N being from 1 to 9). Thus, you do not have to call sync.view.ViewManager#addView. Instead, just use one of these IDs, as in the following: workspace.getViewManager().installView('framework-view-1', new MyViewRenderer()); × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-dialog.html":{"id":"tutorial-dialog.html","title":"Tutorial: Presenting a Dialog to the User","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEven hoice. A simple way to prompt the user for input inside the Author operations is to use the [ask editor variables] (https://www.oxygenxml.com/doc/help.php?product=waCustom&amp;platform=standalone&amp;pageId=webapp_editor_variables). Another possibility is to use the Web Author API to present a dialog box that matches the look and feel of the entire application and that is tested to work on all supported platforms. The following example contains an action that presents some information about the element currently at the cursor position. /** * The action that shows a dialog with information about the element at caret. */ class ShowTagAction extends sync.actions.AbstractAction { /** * Constructor * @param {sync.api.Editor} editor The editor */ constructor(editor) { super(editor, ''); this.editor = editor; this.dialog = workspace.createDialog(); this.dialog.setTitle('Element Information'); this.dialog.setButtonConfiguration(sync.api.Dialog.ButtonConfiguration.OK); } /** @override */ getDisplayName() { return 'Show element info'; }; /** @override */ actionPerformed(callback) { let oxyNode = this.editor.getSelectionManager().getSelection().getNodeAtCaret(); if (oxyNode) { this.dialog.getElement().textContent = 'The tag of the element is: ' + oxyNode.getTagName(); this.dialog.onSelect(goog.bind(function(key, event) { // handle user choice. }, this)); this.dialog.show(); } }; /** @override */ isEnabled() { let oxyNode = this.editor.getSelectionManager().getSelection().getNodeAtCaret(); if (oxyNode) { return oxyNode.getType() == goog.dom.NodeType.ELEMENT; } return false; }; }; This action can be added to a toolbar or in the contextual menu as described in the Implementing a Custom Action tutorial. To use it, place the cursor inside an element and invoke the action. A dialog box with the tag name of the element should be displayed. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-formcontrol.html":{"id":"tutorial-formcontrol.html","title":"Tutorial: Implementing a Custom Form Control","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Implementing a Custom Form Control Oxygen XML Web Author supports form controls to allow the inline editing of XML attributes or XML elements with a specific structure. Along with the built-in form controls (such as buttons, text fields, combo boxes, etc.), Web Author also provides support for custom form controls. Some of the possible use cases include: Editing XML fragments with a specialized structure (for example, MathML equations) Editing attributes whose possible values are given by an external service (for example, book reference numbers) Editing external meta-information associated with an XML element (for example, comments stored in the CMS) A custom form control can be associated with an element using the custom CSS function oxy_editor. They need to have a webappRendererClassName property that specifies the Java class that handles the initial rendering of the form-control. The class needs to extend the ro.sync.ecss.extensions.api.webapp.formcontrols.WebappFormControlRenderer and to create an HTML fragment to be included in the rendered version of the document. A custom form control can also have some client-side code to define its behavior. This code should provide an implementation of the sync.formctrls.Enhancer base class. To modify the document, an Enhancer may use the actions manager to invoke server-side operations. The following is an example that inserts an empty element at the cursor position: editor.getActionsManager().invokeOperation('ro.sync.ecss.extensions.commons.operations.InsertOrReplaceFragmentOperation', { fragment: '&lt;element/&gt;', insertLocation: \".\", insertPosition: \"Replace\" }, callback); The way that an enhancer is registered differs if it is part of a framework or a plugin. Both cases are discussed below. Registering a Custom Form Control from a Framework If using a framework, this code should register an sync.ext.Extension object using the sync.ext.Registry.registerExtension function. The script may use sync.ext.Registry#getExtensionURL to find a URL that maps to the web/ folder of the framework. Then, the sync.ext.Extension#getEnhancers method should be used to provide a mapping from the Java-based renderer (fully-qualified) class name to the constructor functions of the enhancers. Registering a custom Form Control from a Plugin In a plugin, form control enhancers can be registered using sync.api.Editor#registerEnhancer. Example An example implementation can be found on GitHub in the web-author-mathml-plugin project. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-loadingoptions.html":{"id":"tutorial-loadingoptions.html","title":"Tutorial: Customising the Editor using Loading Options","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.a nc.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Customising the Editor using Loading Options You can toggle certain editor features on or off or customise them using loading options. Using loading options, you can control things such as: title - The title of the document. If not specified, it is inferred from the URL. userName - The name of the user who will edit the document. It is used as the author for comments and displayed in the top-right corner. If not specified, it is inferred from the author URL variable. content - The content of the document. If not specified, the server will load the content from the given URL. ccOnEnter - A flag that controls whether or not the content completion list is presented when the user presses 'Enter', etc. You can find all the available loading options here: sync.api.Workspace.LoadingOptions. To set the loading option values, you can listen for the sync.api.Workspace.BeforeEditorOpenedEvent event: workspace.listen(sync.api.Workspace.EventType.BEFORE_EDITOR_LOADED, function(e) { // e is of type sync.api.Workspace.BeforeEditorOpenedEvent e.options.expandTopicRefs = true; }); × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-mentions.html":{"id":"tutorial-mentions.html","title":"Tutorial: Implementing a Custom Mentions (User @mention) Provider","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEve current editor's editing support and call sync.api.author.ReviewCommentsManager#setUserMentionProposalsProvider. This should be done when the editor is loaded so that the provider is in place when the user opens the Add Comment dialog: workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { var editor = e.editor; var reviewCommentsManager = editor.getEditingSupport().getReviewCommentsManager(); if (reviewCommentsManager) { reviewCommentsManager.setUserMentionProposalsProvider(new MyUserMentionProposalsProvider()); } }); Implementing the provider Your provider must implement sync.api.author.UserMentionProposalsProvider: it has a single method, getUserMentionsProposals(), which returns a Promise that resolves to either a flat array of sync.api.author.UserMentionProposal objects or an array of sync.api.author.UserMentionProposalsGroup objects (groups with a category name and a list of users). Each user proposal has: username (required): the name that identifies the user and is inserted into the document when the mention is confirmed. For example, selecting \"John Doe\" from the dropdown inserts @\"John Doe\" into the comment text. email (optional): used purely as an identifier for the user — it is not inserted into the document. It is displayed in the suggestions list alongside the username to help distinguish users who share the same display name. If multiple proposals share the same username, they are merged into a single entry in the dropdown, with all their emails shown together separated by commas (e.g. john.doe@example.com, j.doe@corp.com). Since mentions are always inserted by username, it is not possible to mention only one of them — selecting that entry mentions everyone who shares that username. To allow them to be mentioned independently, ensure each person has a unique username. Flat list of users /** * Provides a simple flat list of users that can be mentioned in comments. */ class MyUserMentionProposalsProvider extends sync.api.author.UserMentionProposalsProvider { /** @override */ getUserMentionsProposals() { return Promise.resolve([ { username: 'Alice Smith', email: 'alice@example.com' }, { username: 'Bob Jones', email: 'bob@example.com' }, { username: 'Carol White' } ]); } } Grouped users (categories) You can return groups so that the \"@\" menu shows categories (e.g. \"Recent Collaborators\", \"Team\"): /** * Provides users grouped by category in the mentions dropdown. */ class GroupedUserMentionProposalsProvider extends sync.api.author.UserMentionProposalsProvider { /** @override */ getUserMentionsProposals() { return Promise.resolve([ { categoryName: 'Recent Collaborators', users: [ { username: 'Alice Smith', email: 'alice@example.com' }, { username: 'Bob Jones' } ] }, { categoryName: 'Others', users: [ { username: 'Carol White', email: 'carol@example.com' }, { username: 'Dave Brown' } ] } ]); } } Categories appear as section headers in the dropdown; users are listed under each category. Loading users asynchronously The method returns a Promise, so you can load users from a server or other async source: /** * Fetches mentionable users from a REST API. */ class ApiUserMentionProposalsProvider extends sync.api.author.UserMentionProposalsProvider { /** @override */ getUserMentionsProposals() { return fetch('/api/collaborators') .then(function(response) { return response.json(); }) .then(function(data) { return data.users.map(function(u) { return { username: u.displayName, email: u.email }; }); }); } } Default behavior If you do not set a custom provider, the editor uses a default implementation that collects authors from the current document (review comments and change tracking) and the current reviewer name. Setting your own provider replaces this behavior entirely. Notifying mentioned users Once you have the right users appearing in the dropdown, you may also want to send them a notification when they are actually mentioned in a comment. This is handled separately via the sync.api.author.ReviewCommentHook API, which lets you react after a comment is inserted in the document and read the list of mentioned user names from it. See the Intercepting and Reacting to Review Comments tutorial for details and a complete example. Related APIs sync.api.author.ReviewCommentsManager – manager for review comments; use setUserMentionProposalsProvider to install your provider. sync.api.author.ReviewCommentHook – hook into comment add/edit events. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-modifydoc.html":{"id":"tutorial-modifydoc.html","title":"Tutorial: Modifying the Document","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighli event: workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { var editor = e.editor; }); To do this, you should use the sync.api.ActionsManager#invokeOperation API to invoke a Java operation (subclass of ro.sync.ecss.extensions.api.AuthorOperation) on the server-side model of the document. The client-side model will be updated automatically. The code should look like this: if (editor.getEditingSupport().getType() === sync.api.Editor.EditorTypes.AUTHOR) { editor.getActionsManager().invokeOperation( 'ro.sync.ecss.extensions.commons.operations.InsertOrReplaceTextOperation', {text: 'Oxygen XML Web Author'}, function() { console.log('Done!'); }); } The operation is the name of a Java class that implements the desired behavior. It can be one of the operations listed here as sub-classes of ro.sync.ecss.extensions.api.AuthorOperation. Note: If none of the the built-in operations is suitable for your use-case, you need to implement a custom Java sub-class of ro.sync.ecss.extensions.api.AuthorOperation. In some cases, chaining two built-in actions would solve your problem, for example, inserting a fragment and setting a pseudo-class. Even in such a case it is advisable to implement a Java operation for the following reasons: Performance - each AuthorOperation requires a server round-trip which adds to the latency. Undo behavior - each AuthorOperation generates an undo-able edit, so the user will have to undo twice to revert what they percieve as a single edit. The operation can be a custom one implemented in a framework or a plugin. In this case, it should be annotated with ro.sync.ecss.extensions.api.webapp.WebappRestSafe for Web Author to allow invoking it from client-side JS code. It is also useful to annotate it with ro.sync.ecss.extensions.api.WebappCompatible. If the operation is implemented in a plugin, make sure that the class attribute of the plugin element in the plugin.xml descriptor file is a not the ro.sync.exml.plugin.Plugin class itself, but a subclass of it. If the operation extends ro.sync.ecss.extensions.api.webapp.AuthorOperationWithResult, besides modifying the document, it can also return a result to the client-side JS code. This result will be passed as the first result to the callback function. You can find details about the arguments of default operations in the user's manual × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-operationwithresult.html":{"id":"tutorial-operationwithresult.html","title":"Tutorial: Retrieving Information About the Current Document by Invoking Java Operations from JavaScript Code","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Retrieving Information About the Current Document by Invoking Java Operations from JavaScript Code Suppose that you want to retrieve the names of the allowed elements that a user can insert at the current cursor position. First, you have to implement a Java class to extend the ro.sync.ecss.extensions.api.webapp.AuthorOperationWithResult class which will be invoked to return a result to the JavaScript code. package com.example.plugin; import java.util.ArrayList; import java.util.List; import javax.swing.text.BadLocationException; import org.slf4j.Logger; import org.slf4j.LoggerFactory; import ro.sync.contentcompletion.xml.CIElement; import ro.sync.contentcompletion.xml.WhatElementsCanGoHereContext; import ro.sync.ecss.extensions.api.ArgumentsMap; import ro.sync.ecss.extensions.api.AuthorAccess; import ro.sync.ecss.extensions.api.AuthorOperationException; import ro.sync.ecss.extensions.api.AuthorSchemaManager; import ro.sync.ecss.extensions.api.webapp.AuthorDocumentModel; import ro.sync.ecss.extensions.api.webapp.AuthorOperationWithResult; import ro.sync.ecss.extensions.api.webapp.WebappRestSafe; /** * Returns a comma-separated list of element QNames that can be inserted * at the current caret position. */ @WebappRestSafe public class GetElementsAtCaretOperation extends AuthorOperationWithResult { private static final Logger logger = LoggerFactory.getLogger(GetElementsAtCaretOperation.class); @Override public String doOperation(AuthorDocumentModel model, ArgumentsMap args) throws AuthorOperationException { List&lt;String&gt; elementNames = new ArrayList&lt;&gt;(); try { AuthorAccess authorAccess = model.getAuthorAccess(); AuthorSchemaManager authorSchemaManager = authorAccess.getDocumentController().getAuthorSchemaManager(); int caretOffset = authorAccess.getEditorAccess().getCaretOffset(); WhatElementsCanGoHereContext context = authorSchemaManager.createWhatElementsCanGoHereContext(caretOffset); if (context != null) { List&lt;CIElement&gt; childrenElements = authorSchemaManager.whatElementsCanGoHere(context); if (childrenElements != null) { for (CIElement currentElement : childrenElements) { elementNames.add(currentElement.getQName()); } } } } catch (BadLocationException e) { logger.error(\"Failed to determine elements allowed at caret.\", e); throw new AuthorOperationException( \"An exception occurred when trying to determine the elements that can be inserted at caret offset: \" + e.getMessage(), e ); } return String.join(\",\", elementNames); } } To invoke the Author operation asynchronously from the JavaScript code, you have to call sync.api.ActionsManager#invokeOperation. The following code will iterate the list of all element names that can be inserted at the cursor position: var actionsManager = editor.getActionsManager(); actionsManager.invokeOperation('com.example.plugin.GetElementsAtCaretOperation', {}, function(e, result) { result.split(',').forEach(function (elementName) { // ...... }); }); Here you can find the official documentation describing how to set up an Oxygen SDK project using Maven. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-removeaction.html":{"id":"tutorial-removeaction.html","title":"Tutorial: How to Remove a Toolbar Button","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync. UserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace How to Remove a Toolbar Button When oXygen XML Web Author is used for a group of users that are not supposed to perform some action, you can enforce this by removing it completely from the user interface. For example, when used as a review tool, the change tracking support should be turned on by default, and the reviewers should not be able to turn it off. To achieve this, you can enable change tracking from the Administration Page and remove the \"Toggle Change Tracking\" action from the toolbar. In order to remove an action from the toolbar and to prevent it from being performed using any other method (e.g. context menu, shortcut key) you can use the code snippet below: workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { var editor = e.editor; editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { var actionId = 'Author/TrackChanges'; editor.getActionsManager().unregisterAction(actionId); }); }); Inspect the corresponding toolbar button using your browser Dev Tools and look for the \"name\" attribute of the corresponding div. The HTML will look something like: &lt;div class=\"goog-inline-block goog-toolbar-button\" title=\"Toggle Change Tracking\" role=\"button\" name=\"Author/TrackChanges\"&gt; How to Remove an action only from the Toolbar When you want to remove buttons from a specific toolbar while keeping them available in other places (like context menu), you can use the following approach: function removeFromToolbar(editor) { editor.listen(sync.api.Editor.EventTypes.ACTIONS_LOADED, function(e) { var actionsConfig = e.actionsConfiguration; // Find the specific toolbar var targetToolbar = null; if (actionsConfig.toolbars) { for (var i = 0; i &lt; actionsConfig.toolbars.length; i++) { var toolbar = actionsConfig.toolbars[i]; if (toolbar.name === \"Review\") { // Replace \"Review\" with your toolbar name targetToolbar = toolbar; break; } } } if (targetToolbar) { // Remove specific buttons from the toolbar for (var i = targetToolbar.children.length - 1; i &gt;= 0; i--) { var action = targetToolbar.children[i]; if (action.id === \"Author/AcceptChange\" || action.id === \"Author/RejectChange\") { targetToolbar.children.splice(i, 1); } } } }); } // Usage workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { removeFromToolbar(e.editor); }); This code will: Keep the actions available in the context menu and review panel. Only remove them from the specified toolbar. Still allow the actions to be triggered via keyboard shortcuts or other means. To find the correct toolbar name and action IDs: Inspect the toolbar using your browser's Dev Tools. Look for the toolbar's name attribute. For each button, look for the \"name\" attribute of the corresponding div element. The HTML will look something like this: &lt;div class=\"goog-toolbar\" name=\"Review\"&gt; &lt;div class=\"goog-inline-block goog-toolbar-button\" title=\"Accept Change\" role=\"button\" name=\"Author/AcceptChange\"&gt; &lt;div class=\"goog-inline-block goog-toolbar-button\" title=\"Reject Change\" role=\"button\" name=\"Author/RejectChange\"&gt; &lt;/div&gt; The values of the name attributes are what you need to use in the code above. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-reviewcommenthook.html":{"id":"tutorial-reviewcommenthook.html","title":"Tutorial: Intercepting and Reacting to Review Comments","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Intercepting and Reacting to Review Comments When a user adds or edits a review comment through the Add/Edit Comment dialog, the editor fires two interception points: one before the comment is written to the document and one after. You can register a sync.api.author.ReviewCommentHook on the sync.api.author.ReviewCommentsManager to tap into either or both of these points. Note: The hook is only called when a comment is added or edited through the Add/Edit Comment dialog. Other ways to introduce comments into the document (copy-paste, XML Source view, etc.) do not trigger it. Registering the hook Obtain the review comments manager from the editor's editing support and call sync.api.author.ReviewCommentsManager#registerReviewCommentHook. Register in the EDITOR_LOADED event so that the hook is in place before the user opens the comment dialog: workspace.listen(sync.api.Workspace.EventType.EDITOR_LOADED, function(e) { var reviewCommentsManager = e.editor.getEditingSupport().getReviewCommentsManager(); if (reviewCommentsManager) { reviewCommentsManager.registerReviewCommentHook(new MyReviewCommentHook()); } }); You only need to implement the methods relevant to your use case. The rest can be omitted. Validating a comment before it is inserted beforeCommentAdded and beforeCommentEdited are called after the user presses Add/Save in the dialog but before the comment is written to the document. Returning a resolved Promise allows the insertion to proceed; returning a rejected Promise with an Error cancels the insertion and displays the error message to the user. class ValidatingCommentHook extends sync.api.author.ReviewCommentHook { /** @override */ async beforeCommentAdded(comment) { return this.validate_(comment); } /** @override */ async beforeCommentEdited(newComment, oldComment) { return this.validate_(newComment); } async validate_(comment) { var mentioned = comment.getMentionedUserNames(); for (var i = 0; i &lt; mentioned.length; i++) { var exists = await checkUserExists(mentioned[i]); if (!exists) { return Promise.reject(new Error( 'User \"' + mentioned[i] + '\" does not exist. Please remove the mention before saving.' )); } } } } Reacting after a comment is inserted commentAdded and commentEdited are called after the comment is already written to the document. This is the right place to trigger side effects such as notifying mentioned users or updating their roles on the document. If the returned Promise is rejected, the error message is shown to the user, but the comment remains in the document. Notifying mentioned users getMentionedUserNames() returns only the usernames as they appear in the document (e.g. ['Alice Johnson', 'Bob Smith']). Email addresses are not included — they are used solely for display in the suggestions dropdown and are never stored in the document. If you need to send an email notification, your server side must resolve the username to an email address. class NotifyingCommentHook extends sync.api.author.ReviewCommentHook { /** @override */ async commentAdded(comment) { return this.notifyMentioned_(comment); } /** @override */ async commentEdited(newComment, oldComment) { return this.notifyMentioned_(newComment); } async notifyMentioned_(comment) { var mentioned = comment.getMentionedUserNames(); if (mentioned.length === 0) { return; } // Only usernames are available here. The server is responsible for // resolving them to email addresses or other contact details. var response = await fetch('/api/notify-mentions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mentionedUsers: mentioned, commentText: comment.getCommentText(), author: comment.getAuthorName() }) }); if (!response.ok) { return Promise.reject(new Error('Failed to notify mentioned users.')); } } } Updating reviewer roles class RoleUpdateCommentHook extends sync.api.author.ReviewCommentHook { /** @override */ async commentAdded(comment) { var mentioned = comment.getMentionedUserNames(); if (mentioned.length &gt; 0) { await fetch('/api/grant-reviewer-role', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ users: mentioned }) }); } } } The comment object All hook methods receive a sync.api.author.ReviewComment object. The available information is: getCommentText() — the full comment text as typed by the user, including raw mention syntax (e.g. Hello @\"Alice Smith\", please review this.). getMentionedUserNames() — array of user names extracted from the mentions in the comment (e.g. ['Alice Smith']). getAuthorName() — the name of the user who wrote the comment. getTimestamp() — the raw timestamp value as stored in the document (e.g. 20260202T164200+0200). This can be used to identify the comment on the server side. For beforeCommentEdited and commentEdited, both the new and the old comment are provided, so you can compare what changed. Related APIs sync.api.author.ReviewCommentsManager – use registerReviewCommentHook to install your hook. For controlling which users appear in the \"@\" mention dropdown, see the Implementing a Custom Mentions (User @mention) Provider tutorial. × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-showtableproperties.html":{"id":"tutorial-showtableproperties.html","title":"Tutorial: andlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Show Table Properties action for custom table The default DITA framework that is bundled with Web Author provides an action called Table Properties that can be invoked from the contextual menu when the cursor is located anywhere inside a table. It opens a Table Properties dialog box where you can set specific properties for the table elements. The options that are available depend on the context and location within the table where the action was invoked. Table Properties Action Implementation The DITA Table Properties action implementation includes: The configuration added in the .framework file where the action with the show.table.properties id [1] is created and added to the contextual menu actions list [2] (the JAVA AuthorOperation used for this action displays a dialog box specifically for the standalone version of Oxygen XML Editor, so the action must be customized with JavaScript code to be compatible with Web Author). A table-show-properties-action.js JavaScript file that is included in the web folder of the framework. It contains the code that overwrites the original action added in the framework with an action (sync.table.ShowTablePropertiesAction) that displays a dialog box that is compatible with Web Author. It also contains code to determine the selected table (or table elements), the properties that can be set, and the server operation that will be used to set the chosen property values. If you want to include a Table Properties action for a custom table structure in your framework, you can use the DITA Table Properties action implementation as an example and modify (or add) the code to identify your own table elements and to allow the editing of their specific properties. [1] Actions Subtab [2] Contextual Menu Subtab × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "},"tutorial-urlchooser.html":{"id":"tutorial-urlchooser.html","title":"Tutorial: Using a Custom URL Chooser","body":" Oxygen XML Web Author Namespaces syncsync.actionssync.actions.findreplacesync.apisync.api.change_trackingsync.api.domsync.api.mathsync.api.Translationsync.extsync.formctrlssync.optionssync.view Classes goog.Disposablegoog.events.Eventgoog.events.EventTargetHighlightsManagermodule.exportssync.actions.AbstractActionsync.actions.AttributeEditingActionsync.actions.AttributeEditingActionsProvidersync.actions.DropActionsync.actions.OpenActionsync.api.ActionsManagersync.api.ActionsManagerCoresync.api.AuthorEditingSupport.AuthorModelChangedEventsync.api.AuthorEditingSupport.ModelChangedMutationsync.api.AuthorWidgetsFactorysync.api.ChangeTrackingManagersync.api.ConcurrentEditingManagersync.api.CreateDocumentActionsync.api.Dialogsync.api.Dialog.SizeChangedEventsync.api.EditImageMapActionsync.api.EditingContextManagersync.api.EditingSupportsync.api.EditingSupport.DirtyStatusChangedEventsync.api.EditingSupportManagersync.api.Editorsync.api.Editor.ActionsLoadedEventsync.api.Editor.DirtyStatusChangedEventsync.api.Editor.LinkOpenedEventsync.api.Editor.WebappMessageReceivedsync.api.FileBrowsingDialogsync.api.FileBrowsingDialog.FolderEntryDescriptorsync.api.FileBrowsingDialog.UserActionRequiredEventsync.api.FileServersManagersync.api.HighlightUpdateEventsync.api.NotificationsManagersync.api.PersistentHighlightsManagersync.api.PersistentHighlightUpdateEventsync.api.PositionInformationsync.api.Selectionsync.api.SelectionCoresync.api.SelectionManagersync.api.SelectionManagerCoresync.api.SpellCheckersync.api.UrlChoosersync.api.UrlChooser.Contextsync.api.WebappMessagesync.api.Workspacesync.api.Workspace.BeforeEditorOpenedEventsync.api.Workspace.DashboardLifecycleEventsync.api.Workspace.EditorLifecycleEventsync.api.WorkspaceActionsManagersync.api.WrapperAuthorEditingSupportsync.api.WrapperEditingSupportsync.ext.Extensionsync.ext.Registrysync.ext.WrapperExtensionsync.formctrls.Enhancersync.options.PluginsOptionssync.view.ResourceDragHandlersync.view.ViewManagersync.view.ViewRenderer Interfaces AttrCommentDocumentElementEntityRefNamedNodeMapNodeNodeListProcessingInstructionsync.api.FileServersync.api.FileServer.EntryDescriptorsync.api.GuidingArrowRenderersync.api.math.RectText Tutorials Implementing a Custom ActionImplementing a Custom Action for Editing an Attribute ValueCustomizing the Side ViewsPresenting a Dialog to the UserImplementing a Custom Form ControlCustomising the Editor using Loading OptionsImplementing a Custom Mentions (User @mention) ProviderModifying the DocumentRetrieving Information About the Current Document by Invoking Java Operations from JavaScript CodeHow to Remove a Toolbar ButtonIntercepting and Reacting to Review CommentsShow Table Properties action for custom tableUsing a Custom URL Chooser Global beforeCommentAddedbeforeCommentEditedcommentAddedcommentEditedcreateSelectionAroundOffsetseditorChangedgetAuthorNamegetCommentTextgetIcongetMentionedUserNamesgetTimestampgetTitlegetToolbarActionsMapgetToolbarDescriptorgetUserMentionsProposalsinstallopenedrefreshNodesregisterReviewCommentHooksetUserMentionProposalsProvidersupportsEditorworkspace Using a Custom URL Chooser Some editing tasks require the user to link several resources. For example, when inserting an image, the user must provide the URL of that image. The same scenario applies for links between XML document and DITA conrefs. You can improve the user experience by implementing a custom URL chooser that allows choosing a resource in your CMS. This can be achieved by extending the sync.api.UrlChooser class. The following code snippet implements a dummy UrlChooser that shows a prompt to the user that asks for the URL. class DummyUrlChooser extends sync.api.UrlChooser { /** @override */ supports( type) { // Only support image choosing return type == sync.api.UrlChooser.Type.IMAGE; }; /** @override */ chooseUrl(context, chosen) { if (context.getType() == sync.api.UrlChooser.Type.IMAGE) { let result = prompt(\"Please enter image URL\"); chosen(result); } return null; }; }; Then, you can register it using the following API call: workspace.setUrlChooser(new DummyUrlChooser()); Other Use-cases Allow user to choose an image by showing the file browser (url chooser): let urlChooser = workspace.getUrlChooser(); if(urlChooser.supports(sync.api.UrlChooser.Type.IMAGE)) { let chooserContext = new sync.api.UrlChooser.Context(sync.api.UrlChooser.Type.IMAGE); urlChooser.chooseUrl(chooserContext, function (url) { if (url != null) { console.log(url); } else { console.log('dialog closed'); } }, sync.api.UrlChooser.Purpose.CHOOSE); } To make a URL relative to edited document: workspace.makeRelative(editor.getUrl(), theUrl); × Search results Close Documentation generated by JSDoc 3.6.11 using the DocStrap template. "}}
